<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo Benchmark Baseline</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 550px; margin: 50px auto; padding: 0 20px; color: #222; }
    h1 { color: #006747; border-bottom: 2px solid #006747; padding-bottom: 8px; }
    form { display: flex; gap: 8px; margin: 20px 0; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    button { padding: 10px 18px; background: #006747; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    ul { list-style: none; padding: 0; }
    li { padding: 12px 8px; border-bottom: 1px solid #eee; }
    .todo-row { display: flex; justify-content: space-between; align-items: center; }
    .item-text { cursor: pointer; flex: 1; }
    .done { text-decoration: line-through; color: #888; }
    .delete-btn { background: #d9534f; padding: 6px 10px; font-size: 0.85rem; }
    .todo-error { margin-top: 8px; color: #b00020; font-size: 0.9rem; }
  </style>
</head>
<body>
  <h1>Baseline Test Application</h1>
  <form id="todo-form">
    <input id="todo-input" placeholder="Enter task requirement..." required />
    <button type="submit">Add Task</button>
  </form>
  <ul id="todo-list"></ul>

  <script>
    const list = document.getElementById('todo-list');
    const todoErrors = new Map();
    let cachedTodos = [];

    function renderTodos(data) {
      cachedTodos = data;
      list.innerHTML = data.map(item => {
        const error = todoErrors.get(item.id);
        return `
          <li data-id="${item.id}">
            <div class="todo-row">
              <span class="item-text ${item.completed ? 'done' : ''}" data-id="${item.id}" data-action="toggle" tabindex="0" role="button" aria-pressed="${item.completed}">
                ${item.title}
              </span>
              <button type="button" class="delete-btn" data-action="delete" data-id="${item.id}">Delete</button>
            </div>
            ${error ? `<div class="todo-error" role="alert">${error}</div>` : ''}
          </li>
        `;
      }).join('');
    }

    async function fetchTodos() {
      const res = await fetch('/api/todos');
      const data = await res.json();
      renderTodos(data);
    }

    document.getElementById('todo-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });
      input.value = '';
      fetchTodos();
    };

    async function toggleStatus(id) {
      const todo = cachedTodos.find(item => item.id === id);
      if (!todo) return;

      const previousCompleted = todo.completed;
      todo.completed = !todo.completed;
      todoErrors.delete(id);
      renderTodos(cachedTodos);

      try {
        const res = await fetch(`/api/todos/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed: !previousCompleted })
        });

        if (!res.ok) {
          const errorData = await res.json().catch(() => ({ error: 'Update failed' }));
          todo.completed = previousCompleted;
          todoErrors.set(id, errorData.error || 'Update failed');
          renderTodos(cachedTodos);
          return;
        }

        const updatedTodo = await res.json();
        const index = cachedTodos.findIndex(item => item.id === id);
        if (index !== -1) cachedTodos[index] = updatedTodo;
        todoErrors.delete(id);
        renderTodos(cachedTodos);
      } catch (error) {
        todo.completed = previousCompleted;
        todoErrors.set(id, 'Unable to save change');
        renderTodos(cachedTodos);
      }
    }

    async function deleteItem(id) {
      await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      fetchTodos();
    }

    list.addEventListener('click', (event) => {
      const actionTarget = event.target.closest('[data-action]');
      if (!actionTarget) return;

      const action = actionTarget.dataset.action;
      const id = Number(actionTarget.dataset.id);

      if (action === 'toggle') {
        toggleStatus(id);
      }

      if (action === 'delete') {
        deleteItem(id);
      }
    });

    list.addEventListener('keydown', (event) => {
      if (!event.target.matches('.item-text')) return;
      if (event.key === 'Enter' || event.key === ' ') {
        event.preventDefault();
        toggleStatus(Number(event.target.dataset.id));
      }
    });

    fetchTodos();
  </script>
</body>
</html>
