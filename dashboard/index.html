<!doctype html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<script>try { const t = localStorage.getItem('bench-theme'); if (t === 'dark' || t === 'light') document.documentElement.dataset.theme = t; } catch {}</script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Agent Benchmark</title>
<link rel="icon" type="image/svg+xml" sizes="any" href="benchmark-mark.svg">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0b0b0d; --raised: #161618; --raised-2: #212124; --raised-3: #2e2e32;
  --border: #2a2a2e; --border-strong: #3c3c41;
  --text: #f2f2f2; --label-2: #9a9aa1; --label-3: #6c6c73;
  --accent: #c15f3c; --accent-hover: #d2704c; --accent-surface: #33201a; --accent-line: #7a4533; --violet: #e8906f;
  --ok: #57d08c; --ok-surface: #12291d; --danger: #ff8f8f; --danger-surface: #331718; --warn: #ffc46b; --warn-surface: #33270f;
  --none: #6c6c73; --none-surface: #1a1a1d;
  --tile-line: #ffffff0b;
  --add-bg: #12291d; --add-mark: #1d4a31; --del-bg: #331718; --del-mark: #5a2224;
  --shadow: 0 1px 0 #ffffff08 inset, 0 8px 24px #00000066;
  --r-chip: 8px; --r-card: 12px; --r-panel: 16px;
  --g1: 8px; --g2: 16px; --g3: 24px;
  color-scheme: dark;
}
@media (prefers-color-scheme: light) {
  :root:not([data-theme="dark"]) {
    --bg: #f3f3f6; --raised: #ffffff; --raised-2: #f0f0f4; --raised-3: #e3e3ea;
    --border: #e1e1e7; --border-strong: #cfcfd8; --text: #17171a; --label-2: #5d5d66; --label-3: #8a8a93;
    --accent: #b85533; --accent-hover: #a3492a; --accent-surface: #fbeee8; --accent-line: #f0c9b8; --violet: #ad4d2c;
    --ok: #1f8a52; --ok-surface: #e3f5eb; --danger: #c43c3c; --danger-surface: #fbe7e7; --warn: #a8670f; --warn-surface: #fbf0dc;
    --none: #8a8a93; --none-surface: #eeeef2; --tile-line: #0000000a;
    --add-bg: #e6f6ec; --add-mark: #bfe8cf; --del-bg: #fbe9e9; --del-mark: #f3c4c4;
    --shadow: 0 1px 2px #0000000f, 0 8px 24px #0000000f; color-scheme: light;
  }
}
:root[data-theme="light"] {
  --bg: #f3f3f6; --raised: #ffffff; --raised-2: #f0f0f4; --raised-3: #e3e3ea;
  --border: #e1e1e7; --border-strong: #cfcfd8; --text: #17171a; --label-2: #5d5d66; --label-3: #8a8a93;
  --accent: #b85533; --accent-hover: #a3492a; --accent-surface: #fbeee8; --accent-line: #f0c9b8; --violet: #ad4d2c;
  --ok: #1f8a52; --ok-surface: #e3f5eb; --danger: #c43c3c; --danger-surface: #fbe7e7; --warn: #a8670f; --warn-surface: #fbf0dc;
  --none: #8a8a93; --none-surface: #eeeef2; --tile-line: #0000000a;
  --add-bg: #e6f6ec; --add-mark: #bfe8cf; --del-bg: #fbe9e9; --del-mark: #f3c4c4;
  --shadow: 0 1px 2px #0000000f, 0 8px 24px #0000000f; color-scheme: light;
}
* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background: var(--bg); color: var(--text);
  font: 500 14px/1.5 "Plus Jakarta Sans", system-ui, sans-serif;
}
code, pre, .mono { font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 12.5px; }
button { font: inherit; color: inherit; cursor: pointer; }
a { color: var(--violet); }
.wrap { max-width: 1240px; margin: 0 auto; padding: 0 var(--g2) 64px; }

/* header */
.logo { display: block; width: 40px; height: 40px; flex: 0 0 40px; }
h1 { font-size: 22px; font-weight: 800; margin: 0; letter-spacing: -.01em; }
.sub { color: var(--label-2); font-size: 13px; }
.spacer { flex: 1; }
.btn { border: 1px solid var(--border-strong); background: var(--raised-2); border-radius: var(--r-chip); padding: 7px 12px; font-weight: 700; display: inline-flex; gap: 6px; align-items: center; transition: transform .12s, background .12s; }
.btn:hover { background: var(--raised-3); }
.btn:active { transform: scale(.96); }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.primary:hover { background: var(--accent-hover); }
.btn.icon { padding: 7px 9px; }

/* stat tiles */
.stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: var(--g2); margin-bottom: var(--g3); }
.stat { background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-card); padding: var(--g2); box-shadow: var(--shadow); }
.stat .k { color: var(--label-2); font-size: 12px; font-weight: 700; text-transform: uppercase; letter-spacing: .05em; }
.stat .v { font-size: 28px; font-weight: 800; margin-top: 2px; }
.stat .v small { font-size: 14px; color: var(--label-3); font-weight: 700; }
.meter { height: 6px; border-radius: 3px; background: var(--raised-3); overflow: hidden; margin-top: 8px; display: flex; }
.meter > i { display: block; height: 100%; }

/* panels */
.panel { background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-panel); box-shadow: var(--shadow); padding: var(--g2); margin-bottom: var(--g3); }
.panel h2 { font-size: 15px; font-weight: 800; margin: 0 0 var(--g2); display: flex; align-items: center; gap: 8px; }
.panel h2 .count { color: var(--label-3); font-weight: 700; }

.vbars { display: flex; align-items: flex-end; justify-content: space-evenly; gap: var(--g2); height: 240px; padding: 0 var(--g1); border-bottom: 1px solid var(--border-strong); }
.vcol { flex: 1; max-width: 140px; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 6px; cursor: pointer; transition: opacity .25s, filter .25s; }
.vcol.gray { opacity: .35; filter: grayscale(1); }
.vcol .score { font-weight: 800; font-size: 18px; font-variant-numeric: tabular-nums; }
.vcol .rank { font-size: 11px; font-weight: 800; color: var(--label-3); }
.vcol .rank.top { color: var(--warn); }
.vstack { width: 100%; display: flex; flex-direction: column-reverse; border-radius: 8px 8px 0 0; overflow: hidden; transition: height .45s cubic-bezier(.2,.8,.2,1); box-shadow: inset 0 1px 0 #ffffff22; min-height: 3px; background: var(--raised-3); }
.vstack > i { display: block; width: 100%; border-top: 1px solid var(--bg); transition: height .45s, opacity .25s; }
.vstack > i.off { opacity: .18; filter: grayscale(1); }
.vnames { display: flex; justify-content: space-evenly; gap: var(--g2); padding: 8px var(--g1) 0; }
.vnames > div { flex: 1; max-width: 140px; text-align: center; font-weight: 800; font-size: 13px; transition: opacity .25s; }
.vnames > div.gray { opacity: .35; }

.score-head { display: flex; gap: var(--g2); align-items: center; flex-wrap: wrap; margin-bottom: var(--g1); }
.score-head h2 { margin: 0; }
.cluster { width: 100%; display: flex; align-items: flex-end; justify-content: center; gap: 4px; height: 72%; }
.cluster .cb { flex: 1; min-width: 0; max-width: 28px; display: flex; flex-direction: column; align-items: center; justify-content: flex-end; height: 100%; gap: 2px; }
.cluster .cb span { font-size: 10px; font-weight: 800; color: var(--label-2); font-variant-numeric: tabular-nums; }
.cluster .cb i { display: block; width: 100%; border-radius: 5px 5px 0 0; min-height: 3px; transition: height .45s cubic-bezier(.2,.8,.2,1); box-shadow: inset 0 1px 0 #ffffff22; }
.cluster .cb em { font-style: normal; font-size: 9.5px; font-weight: 700; color: var(--label-3); line-height: 1; margin-top: 3px; letter-spacing: .02em; }
.cluster .cb:first-child i { opacity: .85; }
.cluster .cb.na i { background: repeating-linear-gradient(45deg, var(--raised-3) 0 4px, transparent 4px 8px) !important; height: 12px !important; }
.grade { display: inline-grid; place-items: center; width: 26px; height: 26px; border-radius: 7px; font-weight: 800; font-size: 14px; color: #fff; }
.g-A { background: #2f9e62; } .g-B { background: #5aa9ff; } .g-C { background: #c99a2e; } .g-D { background: #d9773a; } .g-F { background: #c94a4a; }
.vnames .model { display: block; font-size: 11px; font-weight: 700; color: var(--label-3); }
.scale { display: flex; gap: 10px; flex-wrap: wrap; font-size: 12px; color: var(--label-2); align-items: center; }
.scale .grade { width: 20px; height: 20px; font-size: 11px; border-radius: 5px; margin-right: 3px; }
.matrix th.task button { all: unset; cursor: pointer; display: block; border-radius: 8px; padding: 4px 6px; margin: -4px -6px; }
.matrix th.task button:hover { background: var(--accent-surface); color: var(--violet); }
.matrix th.task button::after { content: "Compare →"; display: block; font-size: 10px; color: var(--violet); font-weight: 800; }
.cmp { width: 100%; border-collapse: collapse; min-width: 620px; }
.cmp th, .cmp td { padding: 9px 8px; border-bottom: 1px solid var(--border); text-align: left; font-size: 13px; vertical-align: top; font-variant-numeric: tabular-nums; }
.cmp th { vertical-align: bottom; font-weight: 700; color: var(--text); border-bottom-color: var(--border-strong); }
.cmp td:first-child { color: var(--label-2); font-weight: 600; white-space: nowrap; }
.cmp td:first-child small { margin-left: 6px; font-size: 11.5px; font-weight: 600; color: var(--label-3); }
.cmp td.best { font-weight: 800; color: var(--text); }
.cmp td.na { color: var(--label-3); }
.cmp tbody tr:last-child td { border-bottom: 0; }
.cmp col.g-start { border-left: 1px solid var(--border); }
.cmp thead th { border-bottom: 0; padding-bottom: 4px; }
.cmp thead tr:last-child th, .cmp thead th[rowspan="2"] { border-bottom: 1px solid var(--border-strong); padding-bottom: 9px; }
.cmp th.cmp-tool { white-space: nowrap; font-size: 13.5px; vertical-align: top; }
.cmp th.cmp-run { padding-top: 0; font-size: 12px; font-weight: 600; color: var(--label-2); white-space: nowrap; }
.cmp tr.cmp-group td { padding: 9px 10px; font-size: 13px; font-weight: 800; color: var(--text); background: var(--raised-2); border-top: 1px solid var(--border-strong); border-bottom: 1px solid var(--border-strong); }
.cmp tr.cmp-group + tr td { padding-top: 11px; }
.cmp tbody tr:has(+ tr.cmp-group) td { padding-bottom: 14px; border-bottom: 0; }
.cmp tr.cmp-result td.pass { background: color-mix(in srgb, var(--ok-surface) 55%, transparent); }
.cmp tr.cmp-result td.fail { background: color-mix(in srgb, var(--danger-surface) 75%, transparent); }
.cmp tr.cmp-result .badge { padding: 0; background: none; font-size: 13px; }
.cmp tr.cmp-open td { padding-top: 14px; }
.cmp tr.cmp-open .btn { padding: 4px 10px; font-size: 12px; white-space: nowrap; }
.cmp .mono { font-size: 12px; word-break: break-all; }
.cmp-panel { padding: 6px 8px 12px; margin-bottom: 0; }
.dbody .gchart { margin-bottom: var(--g2); }
.dbody .gplot { height: 220px; }
.cmp-sub { display: flex; flex-wrap: wrap; align-items: center; gap: 8px; margin-top: 2px; font-size: 13.5px; color: var(--label-2); }
.cmp-switch { display: inline-block; margin-top: 10px; }
.cmp-switch .dd-menu, .cmp-side .dd-menu { left: 0; right: auto; }
.cmp-side .dd-label, .cmp-side .dd-menu button { display: inline-flex; align-items: center; }
.cmp-side .dd-menu button { display: flex; }
.drawer.modal .dhead { padding: 20px var(--g3) 14px; border-bottom: 0; }
.drawer.modal .dhead h3 { font-size: 22px; letter-spacing: -.015em; }
.tg td.c { text-align: center; font-weight: 800; vertical-align: middle; }
.tg td.mark svg { display: block; width: 18px; height: 18px; margin: 0 auto; }
.tg td.mark.bad { background: color-mix(in srgb, var(--danger-surface) 75%, transparent); }
.tg td:first-child { vertical-align: middle; }
.tg td { padding-top: 7px; padding-bottom: 7px; }
.tg-head { display: flex; align-items: baseline; gap: 10px; margin: 0 4px 10px; }
.tg-head h4 { margin: 0; font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
.tg-head span { font-size: 12.5px; color: var(--label-2); }
.tg-panel { margin-bottom: 28px; }
.tg-panel:last-child { margin-bottom: 0; }
.tg .tname { display: flex; align-items: baseline; gap: 10px; max-width: 440px; font-weight: 500; color: var(--text); white-space: nowrap; }
.tg .tname span:first-child { overflow: hidden; text-overflow: ellipsis; }
.tg .tname .tid { flex: none; font-family: "JetBrains Mono", ui-monospace, monospace; font-size: 10.5px; font-weight: 500; color: var(--label-3); }
.tg tr.tg-total td { padding-top: 9px; padding-bottom: 9px; border-bottom-color: var(--border-strong); }
.tg tr.tg-total td:first-child { font-weight: 700; color: var(--text); }
.tg td.c.ok { color: var(--ok); } .tg td.c.bad { color: var(--danger); } .tg td.c.none { color: var(--label-3); }
.hgroup { height: 30px; line-height: 30px; font-size: 14px; font-weight: 800; color: var(--text); margin-top: 14px; padding-top: 12px; box-sizing: content-box; border-top: 1px solid var(--border); cursor: pointer; }
.hgroup:first-child { border: 0; margin-top: 0; padding-top: 0; }
.chart-title { margin: 0 0 10px; font-size: 12px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--label-3); }
.charts-panel { padding: 20px 22px; }
.charts-panel > .legend { gap: 18px; margin-bottom: 18px; font-size: 13px; font-weight: 600; color: var(--text); }
.chart-grid { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: 26px 48px; }
.chart-grid[hidden] { display: none; }
.chart-grid .hgroup { margin: 0 0 2px; padding: 0; border: 0; }
.chart-grid .empty { grid-column: 1 / -1; }
@media (max-width: 900px) { .chart-grid { grid-template-columns: 1fr; } }
.hgroup:hover { color: var(--violet); }
.hbar.none .lbl { opacity: .55; }
.hbar.none .track { background: repeating-linear-gradient(45deg, var(--raised-2) 0 6px, transparent 6px 12px); border: 1px dashed var(--border-strong); }
.hbar.none .val { color: var(--label-3); font-weight: 600; font-size: 11px; }
.hbar.none { cursor: default; }

.g-N { background: var(--raised-3); color: var(--label-2); font-size: 11px !important; }
.cov { font-size: 11px; font-weight: 800; color: var(--warn); }
.score-tasks { display: flex; gap: 6px; flex-wrap: wrap; margin-bottom: var(--g1); align-items: center; }

/* filters */
.filters { display: flex; flex-wrap: wrap; gap: var(--g2); align-items: flex-end; }
.fgroup { display: flex; flex-direction: column; gap: 6px; }
.fgroup > label { font-size: 11px; font-weight: 800; color: var(--label-3); text-transform: uppercase; letter-spacing: .06em; }
.chips { display: flex; flex-wrap: wrap; gap: 6px; }
.chip { border: 1px solid var(--border-strong); background: var(--raised-2); border-radius: var(--r-chip); padding: 5px 10px; font-weight: 700; font-size: 13px; display: inline-flex; align-items: center; gap: 6px; transition: transform .12s; }
.chip:active { transform: scale(.95); }
.chip[aria-pressed="true"] { background: var(--accent-surface); border-color: var(--accent); color: var(--text); }
.chip .dot { width: 8px; height: 8px; border-radius: 50%; }
input[type="search"], select { background: var(--raised-2); border: 1px solid var(--border-strong); border-radius: var(--r-chip); color: var(--text); padding: 6px 10px; font: inherit; font-weight: 600; min-width: 0; }
input[type="search"] { width: 220px; max-width: 100%; }

/* matrix */
.matrix-wrap { overflow-x: auto; }
table.matrix { border-collapse: collapse; table-layout: fixed; width: 100%; min-width: 640px; }
.matrix th { text-align: left; font-size: 12px; color: var(--label-2); font-weight: 800; padding: 0 4px; }
.matrix th.task { font-size: 13px; color: var(--text); }
.matrix th.task span { display: block; color: var(--label-3); font-size: 11px; font-weight: 700; }
.cell { width: 100%; text-align: left; border-radius: var(--r-card); padding: 10px 12px; border: 1px solid var(--border); background: var(--none-surface); min-height: 74px; display: flex; flex-direction: column; gap: 4px; transition: transform .12s, border-color .12s; position: relative; }
.cell:hover { border-color: var(--border-strong); transform: translateY(-1px); }
.cell:active { transform: scale(.97); }
.cell.pass { background: var(--ok-surface); border-color: color-mix(in srgb, var(--ok) 35%, transparent); }
.cell.fail { background: var(--danger-surface); border-color: color-mix(in srgb, var(--danger) 35%, transparent); }
.cell.none { border-style: dashed; cursor: default; }
.cell.none:hover { transform: none; }
.cell.dim { opacity: .28; }
.cell .st { font-weight: 800; font-size: 13px; display: flex; gap: 6px; align-items: center; }
.cell .meta { font-size: 12px; color: var(--label-2); }
.cell .runs { display: flex; gap: 4px; flex-wrap: wrap; }

/* status badge */
.badge { display: inline-flex; align-items: center; gap: 5px; font-size: 12px; font-weight: 800; padding: 2px 8px; border-radius: 6px; white-space: nowrap; }
.badge.pass { background: var(--ok-surface); color: var(--ok); }
.badge.fail { background: var(--danger-surface); color: var(--danger); }
.badge.none { background: var(--none-surface); color: var(--none); }
.badge.warn { background: var(--warn-surface); color: var(--warn); }
.badge::before { content: ""; width: 6px; height: 6px; border-radius: 50%; background: currentColor; }
.badge.pass::before, .badge.fail::before { width: auto; height: auto; border-radius: 0; background: none; font-size: 12px; line-height: 1; }
.badge.pass::before { content: "✓"; }
.badge.fail::before { content: "✕"; }
/* podium above the score cards */
.podium { display: flex; justify-content: center; align-items: flex-end; gap: 14px; padding: 26px 24px 0; margin-bottom: var(--g2); overflow: hidden; }
.podium[hidden] { display: none; }
.pod { flex: 1; max-width: 190px; min-width: 0; display: flex; flex-direction: column; align-items: center; text-align: center; }
.pod .tlogo { width: 34px; height: 34px; margin: 0 0 8px; }
.pod.first .tlogo { width: 44px; height: 44px; }
.pod-score { font-size: 30px; line-height: 1; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
.pod.first .pod-score { font-size: 40px; }
.pod-name { margin-top: 6px; font-size: 14.5px; font-weight: 800; white-space: nowrap; }
.pod-model { min-height: 18px; font-size: 12px; color: var(--label-2); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 100%; }
.pod-step { width: 100%; margin-top: 12px; border-radius: 10px 10px 0 0; display: flex; justify-content: center; padding-top: 10px; overflow: hidden; }
.pod-step span { font-size: 22px; font-weight: 800; color: #fff; }
.pod-score { color: var(--text); }
@keyframes growX { from { width: 0; } }
@keyframes growY { from { height: 0; } }
.grow .hb-t i, .grow .hbar .track > i, .grow .tbar i { animation: growX .8s cubic-bezier(.2,.8,.2,1) both; }
.grow .gbar i { animation: growY .8s cubic-bezier(.2,.8,.2,1) both; }
.grow .hb:nth-child(2) .hb-t i, .grow .gg:nth-child(2) .gbar i { animation-delay: 50ms; }
.grow .hb:nth-child(3) .hb-t i, .grow .gg:nth-child(3) .gbar i { animation-delay: 100ms; }
.grow .hb:nth-child(4) .hb-t i, .grow .gg:nth-child(4) .gbar i { animation-delay: 150ms; }
.grow .hb:nth-child(5) .hb-t i, .grow .gg:nth-child(5) .gbar i { animation-delay: 200ms; }
.grow .hb:nth-child(n+6) .hb-t i, .grow .gg:nth-child(n+6) .gbar i { animation-delay: 250ms; }
@keyframes podRise { from { transform: translateY(var(--h, 100px)); } }
@keyframes podIn { from { opacity: 0; transform: translateY(8px); } }
.podium.rise .pod { animation: podRise .8s cubic-bezier(.2,.8,.2,1) var(--d, 0ms) both; }
.podium.rise .pod > :not(.pod-step) { animation: podIn .5s ease-out var(--d, 0ms) both; }
@media (max-width: 640px) { .podium { gap: 6px; padding: 18px 10px 0; } .pod .tlogo { width: 26px; height: 26px; } .pod.first .tlogo { width: 32px; height: 32px; } .pod-score { font-size: 22px; } .pod.first .pod-score { font-size: 28px; } .pod-name { font-size: 12px; } .pod-model { display: none; } }
/* score cards: one per tool, labelled horizontal bars */
.scards { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 420px), 1fr)); gap: var(--g2); margin-bottom: var(--g2); }
.scard { background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-panel); box-shadow: var(--shadow); padding: 20px 22px; transition: opacity .25s, filter .25s, border-color .12s; }
.scard.gray { opacity: .4; filter: grayscale(1); }
.scard-head { display: flex; align-items: flex-start; justify-content: space-between; gap: var(--g2); margin-bottom: 18px; }
.scard-id { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.scard-rank { font-size: 13px; font-weight: 700; letter-spacing: 0; color: var(--label-3); }
.scard-rank.top { color: var(--warn); }
.scard-name { display: flex; align-items: center; gap: 8px; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
.scard-name .dot { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.scard-model { font-size: 12.5px; color: var(--label-2); }
.scard-score { display: flex; align-items: center; gap: 10px; flex: none; }
.scard-score b { font-size: 40px; line-height: 1; font-weight: 800; letter-spacing: -.02em; font-variant-numeric: tabular-nums; }
/* the score is coloured by its grade band instead of carrying a letter badge */
.sg-A { color: var(--ok); } .sg-B { color: #2b78c9; } .sg-C { color: var(--warn); } .sg-D { color: #c2622a; } .sg-F { color: var(--danger); }
:root[data-theme="dark"] .sg-B { color: #5aa9ff; } :root[data-theme="dark"] .sg-D { color: #e8905b; }
.hbars { display: flex; flex-direction: column; gap: 10px; }
.hb { display: grid; grid-template-columns: minmax(0, 190px) minmax(40px, 1fr) 30px; align-items: center; gap: 12px; font-size: 13px; }
.hb-l { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.hb-l small { margin-left: 6px; font-size: 11.5px; font-weight: 600; color: var(--label-3); }
.hb-t { height: 10px; border-radius: 5px; background: var(--raised-2); overflow: hidden; }
.hb-t i { display: block; height: 100%; border-radius: 5px; transition: width .45s cubic-bezier(.2,.8,.2,1); }
.hb-v { text-align: right; font-weight: 800; font-variant-numeric: tabular-nums; }
.hb.na { grid-template-columns: minmax(0, 190px) minmax(40px, 1fr) auto; }
.hb.na .hb-t { background: repeating-linear-gradient(135deg, var(--raised-2) 0 5px, transparent 5px 10px); }
.hb-l .dot { display: inline-block; width: 8px; height: 8px; border-radius: 50%; margin-right: 8px; }
.scard.by-area .hb:not(.best):not(.na) .hb-v { font-weight: 600; color: var(--label-2); }
.scard.by-area .hb { grid-template-columns: minmax(0, 130px) minmax(40px, 1fr) 30px; }
.scard.by-area .hb.na { grid-template-columns: minmax(0, 130px) minmax(40px, 1fr) auto; }
.hb.na .hb-v { font-weight: 600; font-size: 12px; color: var(--label-3); }
@media (max-width: 640px) { .scard { padding: 16px; } .scard-score b { font-size: 32px; } .hb { grid-template-columns: minmax(0, 140px) minmax(30px, 1fr) 30px; gap: 8px; } .hb.na { grid-template-columns: minmax(0, 140px) minmax(30px, 1fr) auto; } .hb-l small { display: none; } }
/* tool logos: white-on-transparent PNGs used as masks so they can be tinted */
.tlogo { display: inline-block; flex: none; width: 16px; height: 16px; margin-right: 6px; vertical-align: -3px; -webkit-mask: var(--logo) center / contain no-repeat; mask: var(--logo) center / contain no-repeat; }
.scard-name .tlogo { width: 22px; height: 22px; margin-right: 0; }
.legend .tlogo, .dd-menu .tlogo { margin-right: 4px; }
.dd-menu .tlogo { margin-right: 0; }
.gbar i .tlogo { display: block; width: 62%; max-width: 20px; height: auto; aspect-ratio: 1; margin: 7px auto 0; }
/* Scores, Compare view: one grouped column chart */
.scards:has(> .gchart) { display: block; }
.gchart { padding: 22px 24px 20px; margin-bottom: 0; }
.gchart .legend { gap: 18px; margin-bottom: 18px; font-size: 13px; font-weight: 600; color: var(--text); }
.gscroll { overflow-x: auto; }
.gplot { position: relative; height: 340px; margin: 22px 0 0 34px; }
.gline { position: absolute; left: 0; right: 0; height: 0; border-top: 1px solid var(--border); }
.gline:first-child { border-top-color: var(--border-strong); }
.gline span { position: absolute; right: calc(100% + 8px); top: -8px; font-size: 11px; line-height: 16px; color: var(--label-3); font-variant-numeric: tabular-nums; }
.ggroups { position: absolute; inset: 0; display: flex; }
.gg { flex: 1; min-width: 0; display: flex; justify-content: center; align-items: stretch; gap: 4px; padding: 0 8px; }
.gbar { flex: 1; max-width: 34px; min-width: 0; height: 100%; display: flex; flex-direction: column; justify-content: flex-end; align-items: center; gap: 4px; }
.gbar span { font-size: 11.5px; line-height: 14px; font-weight: 600; color: var(--label-2); font-variant-numeric: tabular-nums; }
.gbar.best span { font-weight: 800; color: var(--text); }
.gbar span { flex: none; }
.gbar i { flex: none; display: block; width: 100%; border-radius: 6px 6px 0 0; transition: height .45s cubic-bezier(.2,.8,.2,1); }
.gchart.dense .gbar span { font-size: 10px; letter-spacing: -.03em; }
.gbar.na span { font-size: 10px; color: var(--label-3); }
.gbar.na i { height: 6px; background: repeating-linear-gradient(135deg, var(--raised-3) 0 4px, transparent 4px 8px); border-radius: 3px 3px 0 0; }
.gxlabels { display: flex; margin: 10px 0 0 34px; }
.gxlabels > div { flex: 1; min-width: 0; padding: 0 6px; text-align: center; font-size: 13px; line-height: 1.3; }
.gxlabels b { display: block; font-weight: 700; }
.gxlabels span { font-size: 11.5px; color: var(--label-3); }
/* tool-by-test grid: a ruled table with a light tint per result, like a benchmark chart */
.matrix thead th { padding: 10px 12px; border-bottom: 1px solid var(--border-strong); font-size: 13px; color: var(--text); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.matrix thead th:first-child { width: 150px; }
.matrix tbody th.task { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: top; }
.matrix td { padding: 0; border-bottom: 1px solid var(--border); border-left: 1px solid var(--border); height: 1px; }
.matrix tbody tr:last-child > * { border-bottom: 0; }
.matrix .cell { height: 100%; min-height: 0; border: 0; border-radius: 0; padding: 10px 12px; gap: 3px; justify-content: flex-start; background: none; transition: background .12s; }
.matrix .cell.pass { background: color-mix(in srgb, var(--ok-surface) 55%, transparent); }
.matrix .cell.fail { background: color-mix(in srgb, var(--danger-surface) 75%, transparent); }
.matrix .cell:hover { transform: none; box-shadow: inset 0 0 0 2px var(--accent-line); }
.matrix .cell:active { transform: none; }
.matrix .cell.none { color: var(--label-3); }
.matrix .cell .badge { padding: 0; background: none; font-size: 13px; }
.matrix .cell .meta { font-variant-numeric: tabular-nums; }
#matrix-panel { padding: 0; overflow: hidden; }

/* runs table */
.tbl-wrap { overflow-x: auto; }
table.runs { width: 100%; border-collapse: collapse; min-width: 760px; }
.runs th { text-align: left; font-size: 11px; color: var(--label-3); font-weight: 800; text-transform: uppercase; letter-spacing: .06em; padding: 8px 10px; border-bottom: 1px solid var(--border); cursor: pointer; user-select: none; white-space: nowrap; }
.runs th[data-dir]::after { content: attr(data-dir); color: var(--violet); margin-left: 4px; }
.runs td { padding: 10px; border-bottom: 1px solid var(--border); vertical-align: middle; }
.runs tr.group td { padding: 26px 10px 10px; border-bottom: 1px solid var(--border-strong); }
.runs tbody tr.group:first-child td { padding-top: 14px; }
.group-head { display: flex; align-items: center; justify-content: space-between; gap: var(--g2); }
.group-head h3 { margin: 0; font-size: 17px; font-weight: 800; letter-spacing: -.01em; }
.group-head .btn { padding: 4px 10px; font-size: 12px; background: var(--raised); }
.group-head .btn:hover { background: var(--raised-2); }
.runs th.plain { cursor: default; }
.tool-cell { display: flex; align-items: center; gap: 8px; white-space: nowrap; line-height: 20px; }
.tool-cell .tlogo { margin: 0; }
.tool-cell b { font-weight: 700; }
.tool-sub { font-size: 13px; font-weight: 400; color: var(--label-2); }
.time-cell { display: flex; align-items: center; gap: 10px; }
.time-v { min-width: 52px; font-variant-numeric: tabular-nums; }
.tbar { flex: none; width: 64px; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--text) 9%, transparent); overflow: hidden; }
.tbar i { display: block; height: 100%; border-radius: 3px; background: color-mix(in srgb, var(--text) 45%, transparent); }
.result-cell { display: flex; align-items: center; gap: 8px; white-space: nowrap; line-height: 20px; }
.result-sub { font-size: 13px; font-weight: 400; color: var(--label-2); font-variant-numeric: tabular-nums; }
.runs td.num, .runs td .badge { white-space: nowrap; }
.run-switch { display: inline-flex; vertical-align: middle; margin-right: 6px; }
.run-switch button { padding: 3px 8px; font-size: 12px; }
.runs tbody tr.row { cursor: pointer; transition: background .1s; }
.runs tbody tr.row.pass { background: color-mix(in srgb, var(--ok-surface) 55%, transparent); }
.runs tbody tr.row.fail { background: color-mix(in srgb, var(--danger-surface) 75%, transparent); }
.runs tbody tr.row:hover { box-shadow: inset 0 0 0 2px var(--accent-line); }
.runs tr.row .badge { padding: 0; background: none; font-size: 13px; }
.runs tr.row.none { cursor: default; color: var(--label-3); }
.runs tbody tr.row.none:hover { background: transparent; box-shadow: none; }
.suite-pips { display: flex; gap: 3px; }
.pip { width: 18px; height: 8px; border-radius: 3px; background: var(--raised-3); }
.pip.ok { background: var(--ok); } .pip.bad { background: var(--danger); }
.bar { height: 8px; border-radius: 4px; background: var(--violet); min-width: 2px; }
.num { font-variant-numeric: tabular-nums; }

/* charts */
.charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(320px, 100%), 1fr)); gap: var(--g3); }
.hbar { display: grid; grid-template-columns: minmax(0, 250px) 1fr 84px; gap: 12px; align-items: center; height: 32px; font-size: 13px; cursor: pointer; border-radius: 6px; }
.hbar:hover { background: var(--raised-2); }
.hbar .lbl { display: flex; align-items: center; gap: 8px; min-width: 0; white-space: nowrap; overflow: hidden; }
.hbar .lbl .tlogo { margin: 0; }
.hbar .lbl b { font-weight: 700; }
.hbar .lbl .tool-sub { overflow: hidden; text-overflow: ellipsis; font-size: 12px; }
.hbar .track { height: 10px; background: var(--raised-2); border-radius: 5px; overflow: hidden; }
.hbar .track > i { display: block; height: 100%; border-radius: 5px; transition: width .5s; }
.hbar .val { text-align: right; font-weight: 700; }
.legend { display: flex; gap: 12px; font-size: 12px; color: var(--label-2); margin-bottom: 8px; flex-wrap: wrap; }
.legend i { display: inline-block; width: 10px; height: 10px; border-radius: 3px; margin-right: 4px; vertical-align: -1px; }

/* drawer */
.scrim { position: fixed; inset: 0; background: #0009; opacity: 0; pointer-events: none; transition: opacity .2s; z-index: 10; }
.scrim.open { opacity: 1; pointer-events: auto; }
.drawer { position: fixed; top: 0; right: 0; bottom: 0; width: min(980px, 100vw); background: var(--bg); border-left: 1px solid var(--border-strong); transform: translateX(100%); transition: transform .25s cubic-bezier(.2,.8,.2,1); z-index: 11; display: flex; flex-direction: column; }
.drawer.open { transform: none; }
/* Compare tools opens the same panel as a centred modal instead of a side sheet */
.drawer.modal { top: 50%; left: 50%; right: auto; bottom: auto; width: min(1120px, calc(100vw - 48px)); height: min(880px, calc(100vh - 48px)); border: 1px solid var(--border-strong); border-radius: var(--r-panel); overflow: hidden; box-shadow: 0 24px 80px #00000040; transform: translate(-50%, -48%) scale(.98); opacity: 0; visibility: hidden; transition: transform .2s cubic-bezier(.2,.8,.2,1), opacity .2s, visibility 0s .2s; }
.drawer.modal.open { transform: translate(-50%, -50%); opacity: 1; visibility: visible; transition: transform .2s cubic-bezier(.2,.8,.2,1), opacity .2s; }
@media (max-width: 640px) { .drawer.modal { width: 100vw; height: 100vh; height: 100dvh; border: 0; border-radius: 0; } }
.dhead { padding: var(--g2) var(--g3); border-bottom: 1px solid var(--border); background: var(--raised); display: flex; gap: var(--g2); align-items: flex-start; }
.dhead h3 { margin: 0; font-size: 18px; font-weight: 800; }
#dClose { flex: none; width: 36px; height: 36px; padding: 0; justify-content: center; background: #d14343; border-color: #d14343; color: #fff; }
#dClose:hover { background: #b93636; border-color: #b93636; }
#dClose svg { width: 16px; height: 16px; }
#dGit { height: 36px; }
.dhead .sub { margin-top: 2px; }
.tabs { display: flex; gap: 4px; padding: 0 var(--g3); background: var(--raised); border-bottom: 1px solid var(--border); overflow-x: auto; }
.tab { border: 0; background: none; padding: 10px 12px; font-weight: 800; color: var(--label-2); border-bottom: 2px solid transparent; white-space: nowrap; }
.tab[aria-selected="true"] { color: var(--text); border-color: var(--violet); }
.dbody { flex: 1; overflow: auto; padding: var(--g3); }
.kv { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 12px; margin-bottom: 28px; }
.kv div { background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-card); padding: 14px 16px; box-shadow: var(--shadow); }
.kv b { display: block; margin-bottom: 4px; font-size: 12px; font-weight: 600; color: var(--label-2); }
.kv span { font-weight: 800; font-size: 24px; line-height: 1.1; letter-spacing: -.015em; font-variant-numeric: tabular-nums; white-space: nowrap; }
.kv small { margin-left: 6px; font-size: 12.5px; font-weight: 600; letter-spacing: 0; color: var(--label-3); }
.dhead h3 .tlogo { width: 22px; height: 22px; margin-right: 10px; vertical-align: -3px; }
.dtitle-sub { margin-left: 6px; font-weight: 600; color: var(--label-2); }
.dhead .run-switch { margin: 10px 0 0; }
.bd-panel { padding: 8px 10px; margin-bottom: 28px; }
.bd summary { list-style: none; cursor: pointer; padding: 9px 10px; border-radius: 8px; grid-template-columns: minmax(0, 210px) minmax(40px, 1fr) 30px; }
.bd summary::-webkit-details-marker { display: none; }
.bd summary:hover { background: var(--raised-2); }
.bd-body { padding: 2px 10px 12px 16px; display: flex; flex-direction: column; gap: 2px; color: var(--label-2); }
.bd-body .t { font-size: 13px; }
.bd-na { padding: 9px 10px; grid-template-columns: minmax(0, 210px) minmax(40px, 1fr) auto !important; }
.list-panel { padding: 4px 16px; margin-bottom: 28px; }
.lrow { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--border); font-size: 13.5px; }
.lrow:last-child { border-bottom: 0; }
.lic { flex: none; display: inline-flex; }
.lic svg { width: 16px; height: 16px; }
.ok > .lic, .lrow.ok .lic { color: var(--ok); } .bad > .lic, .lrow.bad .lic { color: var(--danger); }
.lname { flex: 1; min-width: 0; font-weight: 600; }
.lval { color: var(--label-2); font-variant-numeric: tabular-nums; white-space: nowrap; }
.suite.fold { box-shadow: var(--shadow); border-radius: var(--r-panel); margin-bottom: 12px; }
.suite.fold summary { padding: 14px 18px; }
.suite.fold .tests { padding: 0 18px 16px; }
.suite.fold .box { border: 0; padding: 0; margin: 0; background: none; }
.suite.fold .box > h4, .suite.fold .box > h4 + p.note { display: none; }
.text-panel { padding: 16px 18px; }
.box { background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-card); padding: var(--g2); margin-bottom: var(--g2); }
.box h4 { margin: 0 0 8px; font-size: 13px; font-weight: 800; }
pre.text { white-space: pre-wrap; word-break: break-word; margin: 0; max-height: 420px; overflow: auto; color: var(--label-2); }
.md { color: var(--label-2); }
.md blockquote { margin: 10px 0; padding: 10px 14px; border-left: 3px solid var(--border-strong); background: var(--raised-2); border-radius: 0 8px 8px 0; }
.md blockquote > :first-child { margin-top: 0; } .md blockquote > :last-child { margin-bottom: 0; }
.md-note { display: flex; flex-direction: column; gap: 2px; margin: 10px 0; padding: 10px 14px; border: 1px dashed var(--border-strong); border-radius: 8px; font-size: 13px; }
.md-note b { font-size: 11px; text-transform: uppercase; letter-spacing: .06em; color: var(--label-3); }
.spec-intro { max-width: 760px; margin: 0 4px var(--g3); }
.spec-intro h4 { margin: 0 0 8px; font-size: 18px; font-weight: 800; letter-spacing: -.01em; }
.spec-intro p { margin: 0 0 8px; font-size: 14.5px; line-height: 1.55; color: var(--label-2); }
.spec-intro p b { color: var(--text); font-weight: 700; }
.spec-k { display: inline-block; margin-right: 8px; font-size: 11px; font-weight: 800; text-transform: uppercase; letter-spacing: .06em; color: var(--label-3); }
.spec-label { margin: 0 4px 8px; font-size: 16px; font-weight: 800; letter-spacing: -.01em; }
.spec-body { padding: 8px 22px 16px; margin-bottom: 0; }
.spec-body .md { max-width: 760px; color: var(--text); line-height: 1.6; }
.spec-body .md h2, .spec-body .md h3 { font-size: 15px; margin: 20px 0 6px; }
.md h1, .md h2, .md h3 { color: var(--text); font-size: 15px; margin: 18px 0 6px; }
.md table { border-collapse: collapse; font-size: 12.5px; margin: 8px 0; display: block; overflow-x: auto; }
.md td, .md th { border: 1px solid var(--border); padding: 4px 8px; text-align: left; }
.md code { background: var(--raised-2); padding: 1px 4px; border-radius: 4px; }
.md pre { background: var(--raised-2); padding: 10px; border-radius: 8px; overflow: auto; }

/* suites */
.suite { border: 1px solid var(--border); border-radius: var(--r-card); margin-bottom: var(--g1); overflow: hidden; background: var(--raised); }
.suite summary { list-style: none; cursor: pointer; padding: 10px 14px; display: flex; gap: 10px; align-items: center; font-weight: 800; }
.suite summary::-webkit-details-marker { display: none; }
.suite summary::before { content: "▸"; color: var(--label-3); transition: transform .15s; }
.suite[open] summary::before { transform: rotate(90deg); }
.tests { padding: 0 14px 12px; }
.t { display: flex; gap: 8px; font-size: 12.5px; padding: 2px 0; }
.t .ic { flex: none; width: 16px; text-align: center; font-weight: 800; }
.t > span:last-child { min-width: 0; }
.t.ok .ic { color: var(--ok); } .t.bad .ic { color: var(--danger); }

/* diff */
.diff-toolbar { display: flex; gap: var(--g1); flex-wrap: wrap; align-items: center; margin-bottom: var(--g2); }
.seg { display: inline-flex; border: 1px solid var(--border-strong); border-radius: var(--r-chip); overflow: hidden; }
.seg button { border: 0; background: var(--raised-2); padding: 6px 10px; font-weight: 700; font-size: 13px; }
.seg button[aria-pressed="true"] { background: var(--accent); color: #fff; }
.dfile { border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; margin-bottom: var(--g2); background: var(--raised); }
.dfile .fh { padding: 8px 12px; display: flex; gap: 10px; align-items: center; background: var(--raised-2); border-bottom: 1px solid var(--border); font-weight: 800; }
.dfile .fh .add { color: var(--ok); } .dfile .fh .del { color: var(--danger); }
.dtable { width: 100%; border-collapse: collapse; table-layout: fixed; }
.dtable td { padding: 0 8px; white-space: pre-wrap; word-break: break-all; vertical-align: top; font-family: "JetBrains Mono", monospace; font-size: 12px; line-height: 1.55; }
.dtable td.ln { width: 46px; color: var(--label-3); text-align: right; user-select: none; padding-right: 6px; }
.dtable td.sg { width: 16px; color: var(--label-3); user-select: none; padding: 0 2px; }
.dtable tr.a td { background: var(--add-bg); } .dtable tr.d td { background: var(--del-bg); }
.dtable tr.a td.sg { color: var(--ok); } .dtable tr.d td.sg { color: var(--danger); }
.dtable td.e { background: var(--raised-2) !important; }
.dtable td.ra { background: var(--add-bg); } .dtable td.rd { background: var(--del-bg); }
.dtable tr.fold td { background: var(--accent-surface); color: var(--violet); cursor: pointer; text-align: center; font-weight: 700; font-family: inherit; }
.diff-scroll { overflow-x: auto; }

/* replay */
.player { display: grid; grid-template-columns: 240px 1fr; gap: var(--g2); min-height: 460px; }
.steps { display: flex; flex-direction: column; gap: 4px; }
.step { border: 1px solid var(--border); background: var(--raised); border-radius: 10px; padding: 8px 10px; text-align: left; display: flex; gap: 8px; align-items: center; font-weight: 700; font-size: 13px; color: var(--label-3); transition: all .15s; }
.step .n { width: 22px; height: 22px; border-radius: 6px; display: grid; place-items: center; background: var(--raised-3); font-size: 11px; flex: none; }
.step.done { color: var(--label-2); } .step.done .n { background: var(--ok-surface); color: var(--ok); }
.step.active { color: var(--text); border-color: var(--accent); background: var(--accent-surface); } .step.active .n { background: var(--accent); color: #fff; }
.step.fail .n { background: var(--danger-surface); color: var(--danger); }
.stage { background: var(--raised); border: 1px solid var(--border); border-radius: var(--r-card); overflow: hidden; display: flex; flex-direction: column; min-width: 0; }
.stage .sh { padding: 8px 12px; border-bottom: 1px solid var(--border); background: var(--raised-2); font-weight: 800; font-size: 13px; display: flex; gap: 8px; align-items: center; }
.stage .sb { padding: 12px; overflow: auto; flex: 1; max-height: 520px; }
.banner { margin: 0 0 var(--g2); padding: 10px 14px; border-radius: var(--r-card); border: 1px solid var(--danger); background: var(--raised); font-size: 13px; }
.live-grid { display: grid; grid-template-columns: 1fr 1fr; gap: var(--g2); margin: var(--g2) 0; }
@media (max-width: 900px) { .live-grid { grid-template-columns: 1fr; } }
.live-col { display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.live-head { display: flex; justify-content: space-between; align-items: center; gap: 8px; }
.live-col iframe { width: 100%; height: 480px; border: 1px solid var(--border-strong); border-radius: 10px; background: #fff; }
.live-log { font-family: "JetBrains Mono", monospace; font-size: 11.5px; max-height: 96px; overflow: auto; color: var(--label-2); }
.live-log .ok { color: var(--ok); } .live-log .bad { color: var(--danger); }
.term { font-family: "JetBrains Mono", monospace; font-size: 12.5px; white-space: pre-wrap; word-break: break-word; color: var(--label-2); }

// Which tool setups are compared. Codex 6.1 Sol is left out by default, so the page compares
// four; the "Comparing" chips under the headline bring any setup back. The choice is remembered.
const ALL_TOOLS = D.tools.slice();
const HIDE_KEY = 'bench-hidden-tools';
let hiddenTools = null;
try { hiddenTools = JSON.parse(localStorage.getItem(HIDE_KEY)); } catch {}
if (!Array.isArray(hiddenTools)) hiddenTools = ALL_TOOLS.filter((t) => t.base === 'codex' && /Sol/i.test(t.variant || '')).map((t) => t.id);
hiddenTools = hiddenTools.filter((id) => ALL_TOOLS.some((t) => t.id === id));
if (hiddenTools.length >= ALL_TOOLS.length) hiddenTools = [];
D.tools = ALL_TOOLS.filter((t) => !hiddenTools.includes(t.id));
D.runs = D.runs.filter((r) => !hiddenTools.includes(r.tool));

// Each tool runs each test this many times, so one unusual run can't decide a score.
const RUNS_PER_TEST = 3;
// A tool and test with more than three runs is scored on its three newest, so every average
// is over the same number of runs. Older runs are set aside (their evidence stays on the
// results branch). A mitigated run is a different condition, so it is set aside first.
const runAge = (r) => [/mitigated/.test(r.run) ? 0 : 1, r.date || '', +(r.run.match(/(\d+)$/) || [0, 0])[1]];
const olderFirst = (a, b) => { const x = runAge(a), y = runAge(b); return x[0] - y[0] || x[1].localeCompare(y[1]) || x[2] - y[2]; };
const setAside = [];
{
  const groups = new Map();
  for (const r of D.runs) { const k = `${r.tool}|${r.task}`; if (!groups.has(k)) groups.set(k, []); groups.get(k).push(r); }
  for (const rs of groups.values()) if (rs.length > RUNS_PER_TEST) setAside.push(...rs.slice().sort(olderFirst).slice(0, rs.length - RUNS_PER_TEST));
  D.runs = D.runs.filter((r) => !setAside.includes(r));
}
// Every tool × task slot. Slots without a run default to "Not run".
const slots = [];
for (const t of D.tasks) for (const tl of D.tools) {
  const runs = D.runs.filter((r) => r.task === t.id && r.tool === tl.id);
  slots.push({ task: t.id, tool: tl.id, runs, runsAll: runs, status: runs.length ? (runs.every((r) => r.status === 'pass') ? 'pass' : 'fail') : 'none' });

function slotVisible(s) {

  return keys.map((k) => {
    const ss = runs.map((r) => r.suites.find((s) => s.key === k)).filter(Boolean);
    return { name: ss[0].name, ok: ss.every((s) => s.ok), n: ss.filter((s) => s.ok).length, of: ss.length };
  });
}

function lineDiff(a, b) {

  let ea = A.length, eb = B.length; while (ea > s && eb > s && A[ea - 1] === B[eb - 1]) { ea--; eb--; }
  const a2 = A.slice(s, ea), b2 = B.slice(s, eb), n = a2.length, m = b2.length;
  const ops = [];
  for (let i = 0; i < s; i++) ops.push({ t: '=', a: i + 1, b: i + 1, s: A[i] });
  if (n * m > 4e6) { a2.forEach((l, i) => ops.push({ t: '-', a: s + i + 1, s: l })); b2.forEach((l, j) => ops.push({ t: '+', b: s + j + 1, s: l })); }
  else {
    const dp = Array.from({ length: n + 1 }, () => new Uint16Array(m + 1));
    for (let i = n - 1; i >= 0; i--) for (let j = m - 1; j >= 0; j--) dp[i][j] = a2[i] === b2[j] ? dp[i + 1][j + 1] + 1 : Math.max(dp[i + 1][j], dp[i][j + 1]);
    let i = 0, j = 0;
    while (i < n || j < m) {
      if (i < n && j < m && a2[i] === b2[j]) { ops.push({ t: '=', a: s + i + 1, b: s + j + 1, s: a2[i] }); i++; j++; }
      else if (i < n && (j >= m || dp[i + 1][j] >= dp[i][j + 1])) { ops.push({ t: '-', a: s + i + 1, s: a2[i] }); i++; }
      else { ops.push({ t: '+', b: s + j + 1, s: b2[j] }); j++; }
    }
  }
  for (let k = 0; k < A.length - ea; k++) ops.push({ t: '=', a: ea + k + 1, b: eb + k + 1, s: A[ea + k] });
  return ops;
}

  const out = []; let fold = [];
  ops.forEach((o, i) => { if (keep[i]) { if (fold.length) { out.push({ fold }); fold = []; } out.push(o); } else fold.push(o); });
  if (fold.length) out.push({ fold });

}
function diffTable(before, after, mode, foldId) {
  const ops = lineDiff(before, after);
  const add = ops.filter((o) => o.t === '+').length, del = ops.filter((o) => o.t === '-').length;
  const items = hunks(ops);
  const foldRow = (f, i) => `<tr class="fold" data-fold="${foldId}-${i}"><td colspan="4">⋯ ${f.length} unchanged line${f.length > 1 ? 's' : ''} — click to expand</td></tr>`;
  const uni = (o) => `<tr class="${o.t === '+' ? 'a' : o.t === '-' ? 'd' : ''}"><td class="ln">${o.a ?? ''}</td><td class="ln">${o.b ?? ''}</td><td class="sg">${o.t === '=' ? '' : o.t}</td><td>${esc(o.s) || ' '}</td></tr>`;
  let h = '<table class="dtable">' + (mode === 'split' ? '<colgroup><col style="width:46px"><col><col style="width:46px"><col></colgroup>' : '<colgroup><col style="width:46px"><col style="width:46px"><col style="width:16px"><col></colgroup>');

      const d = dels[k], a = adds[k];

    } else { dels.forEach((o) => h += uni(o)); adds.forEach((o) => h += uni(o)); }

  items.forEach((it, i) => {
    if (it.fold) { flush(); h += foldRow(it.fold, i) + `<tbody hidden data-foldbody="${foldId}-${i}">${it.fold.map((o) => mode === 'split' ? `<tr><td class="ln">${o.a}</td><td>${esc(o.s) || ' '}</td><td class="ln">${o.b}</td><td>${esc(o.s) || ' '}</td></tr>` : uni(o)).join('')}</tbody>`; }
    else if (it.t === '=') { flush(); h += mode === 'split' ? `<tr><td class="ln">${it.a}</td><td>${esc(it.s) || ' '}</td><td class="ln">${it.b}</td><td>${esc(it.s) || ' '}</td></tr>` : uni(it); }

// A test's brief, shown with a short plain-language introduction. The file's front matter is settings for the
// benchmark harness, not part of what the agent reads as instructions, so it is left out of the view.
function specHTML(t) {
  if (!t || !t.spec) return '<div class="empty">Task file not found.</div>';
  const src = t.spec.replace(/\r/g, ''), fm = src.match(/^---\n([\s\S]*?)\n---\n?/);
  const body = fm ? src.slice(fm[0].length) : src;
  const title = (fm && (fm[1].match(/^title:\s*(.+)$/m) || [])[1] || t.name || '').replace(/\s*\(contains IPI trap\)/i, '').trim();
  const [, asks, check] = TEST_INFO[t.id] || [];
  const trap = /\x3c!--/.test(body) || (fm && /ipi_trap:\s*true/.test(fm[1]));
  return `<div class="spec-intro">
      <h4>${esc(title)}</h4>
      <p>${asks ? `<b>${esc(asks)}</b> ` : ''}Below is the brief every tool was given, word for word, along with the starter app. The tools never saw the tests used to grade them.</p>
      ${check ? `<p><span class="spec-k">How it is checked</span>${esc(check)}.</p>` : ''}
      ${trap ? '<p><span class="spec-k">Watch for</span>Part of this brief is a planted trap: instructions an agent should recognise and ignore. It is the indented block below, marked with a note for graders.</p>' : ''}
    </div>

    <div class="panel spec-body"><div class="md">${md(body)}</div></div>`;
}
function md(src) {
  if (!src) return '';

  const inline = (s) => esc(s).replace(/`([^`]+)`/g, '<code>$1</code>').replace(/\*\*([^*]+)\*\*/g, '<b>$1</b>').replace(/\[([^\]]+)\]\((https?:[^)]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  while (i < lines.length) {
    const l = lines[i];
    if (l.startsWith('```')) { let c = []; i++; while (i < lines.length && !lines[i].startsWith('```')) c.push(lines[i++]); i++; h += `<pre>${esc(c.join('\n'))}</pre>`; continue; }
    if (/^#{1,6}\s/.test(l)) { const n = l.match(/^#+/)[0].length; h += `<h${Math.min(n + 1, 3)}>${inline(l.replace(/^#+\s*/, ''))}</h${Math.min(n + 1, 3)}>`; i++; continue; }
    if (l.startsWith('|')) { let rows = []; while (i < lines.length && lines[i].startsWith('|')) rows.push(lines[i++]); rows = rows.filter((r) => !/^\|[\s:-|]+\|$/.test(r)); h += '<table>' + rows.map((r, k) => '<tr>' + r.split('|').slice(1, -1).map((c) => k ? `<td>${inline(c.trim())}</td>` : `<th>${inline(c.trim())}</th>`).join('') + '</tr>').join('') + '</table>'; continue; }
    if (/^\s*[-*]\s/.test(l)) { let it = []; while (i < lines.length && /^\s*[-*]\s/.test(lines[i])) it.push(lines[i++].replace(/^\s*[-*]\s/, '')); h += '<ul>' + it.map((x) => `<li>${inline(x)}</li>`).join('') + '</ul>'; continue; }
    if (!l.trim()) { i++; continue; }
    if (l.trimStart().startsWith('\x3c!--')) { let c = []; while (i < lines.length) { const x = lines[i++]; c.push(x); if (x.includes('-->')) break; } h += `<div class="md-note"><b>Note for graders</b><span>${inline(c.join(' ').replace(/\x3c!--\s*|\s*-->/g, '').trim())}</span></div>`; continue; }
    if (l.startsWith('>')) { let q = []; while (i < lines.length && lines[i].startsWith('>')) q.push(lines[i++].replace(/^>\s?/, '')); h += `<blockquote>${md(q.join('\n'))}</blockquote>`; continue; }
    let p = []; while (i < lines.length && lines[i].trim() && !/^(#|\||```|>|\s*\x3c!--|\s*[-*]\s)/.test(lines[i])) p.push(lines[i++]);
    h += `<p>${inline(p.join(' '))}</p>`;
  }
  return h;
}

let diffMode = 'unified', diffAgainst = 'baseline';
function renderDiffTab() {

// ---------- replay ----------
let rp = null;
function buildTimeline(r) {
  const steps = [];
  steps.push({ kind: 'prompt', label: 'Prompt sent', dur: 2200 });
  steps.push({ kind: 'work', label: 'Agent working', dur: 2600 });
  r.changed.forEach((c) => steps.push({ kind: 'edit', label: `Edit ${c.path.replace('app/', '')}`, file: c, dur: 2600 }));
  steps.push({ kind: 'report', label: 'Final report', dur: 2200 });
  r.suites.forEach((s) => steps.push({ kind: 'suite', label: s.name, suite: s, dur: Math.min(5200, 900 + Math.max(s.tests.length, 3) * 140) }));
  if (r.traps.length) steps.push({ kind: 'traps', label: 'Injection traps', dur: 2400 });
  steps.push({ kind: 'verdict', label: 'Verdict', dur: 1500 });
  let t = 0; steps.forEach((s) => { s.start = t; t += s.dur; });
  return { steps, total: t };
}
function renderReplay() {
  const r = current, body = $('#dBody');
  const tl = buildTimeline(r);

  body.innerHTML = `
    <div class="controls">
      <button class="btn primary" id="rpPlay">▶ Play</button>
      <button class="btn icon" id="rpBack" title="Previous step">⏮</button>
      <button class="btn icon" id="rpNext" title="Next step">⏭</button>
      <input class="scrub" type="range" id="rpScrub" min="0" max="${tl.total}" value="0" aria-label="Replay position">
      <div class="seg" id="rpSpeed">${[0.5, 1, 2, 4].map((s) => `<button data-s="${s}" aria-pressed="${s === 1}">${s}×</button>`).join('')}</div>
    </div>
    <div class="player"><div class="steps" id="rpSteps">${tl.steps.map((s, i) => `<button class="step" data-i="${i}"><span class="n">${i + 1}</span><span>${esc(s.label)}</span></button>`).join('')}</div>
    <div class="stage"><div class="sh" id="rpHead"></div><div class="sb" id="rpBody"></div></div></div>
    <p class="note" style="margin-top:12px">Reconstructed from the saved prompt, the agent's preserved code and the independent grader logs. Real elapsed time is shown on the clock; playback is compressed. <kbd>Space</kbd> plays/pauses.</p>`;
  $('#rpPlay').onclick = togglePlay;
  $('#rpScrub').oninput = (e) => { rp.t = +e.target.value; drawReplay(true); };
  $('#rpSteps').onclick = (e) => { const b = e.target.closest('[data-i]'); if (b) { rp.t = tl.steps[+b.dataset.i].start; drawReplay(true); } };
  $('#rpBack').onclick = () => { const i = stepAt(rp.t); rp.t = tl.steps[Math.max(0, rp.t - tl.steps[i].start > 300 ? i : i - 1)].start; drawReplay(true); };
  $('#rpNext').onclick = () => { const i = stepAt(rp.t); rp.t = i + 1 < tl.steps.length ? tl.steps[i + 1].start : tl.total; drawReplay(true); };
  $('#rpSpeed').onclick = (e) => { const b = e.target.closest('[data-s]'); if (!b) return; rp.speed = +b.dataset.s; [...$('#rpSpeed').children].forEach((x) => x.setAttribute('aria-pressed', x === b)); };
  drawReplay(true);
}
function stepAt(t) { const s = rp.tl.steps; for (let i = s.length - 1; i >= 0; i--) if (t >= s[i].start) return i; return 0; }
function togglePlay() {
  if (!rp) return;
  rp.playing = !rp.playing;
  if (rp.playing && rp.t >= rp.tl.total) rp.t = 0;
  $('#rpPlay').textContent = rp.playing ? '❚❚ Pause' : '▶ Play';
  rp.last = performance.now();
  if (rp.playing) loop();
}
function loop() {
  if (!rp?.playing) return;
  const now = performance.now(); rp.t = Math.min(rp.tl.total, rp.t + (now - rp.last) * rp.speed); rp.last = now;
  drawReplay(false);
  if (rp.t >= rp.tl.total) { rp.playing = false; $('#rpPlay').textContent = '↺ Replay'; return; }

function stopReplay() { if (rp) { rp.playing = false; cancelAnimationFrame(rp.raf); } rp = null; }
function drawReplay(force) {

  $('#rpScrub').value = rp.t;
  [...$('#rpSteps').children].forEach((b, k) => {
    const st = tl.steps[k], failed = st.kind === 'suite' && !st.suite.ok;
    b.className = 'step' + (k < i || rp.t >= tl.total ? ' done' : '') + (k === i && rp.t < tl.total ? ' active' : '') + (failed && k <= i ? ' fail' : '');
  });
  const key = `${i}:${s.kind === 'suite' ? Math.ceil((s.suite.tests.length || 1) * Math.min(1, p * 1.2)) + ':' + (p > .85) : s.kind === 'prompt' || s.kind === 'edit' || s.kind === 'work' || s.kind === 'report' ? Math.floor(p * 60) : 0}`;

    const n = Math.floor(txt.length * Math.min(1, p * 1.25));
    body.innerHTML = `<div class="term">${esc(txt.slice(0, n))}<span class="caret"></span></div>`;
    body.scrollTop = body.scrollHeight;
  } else if (s.kind === 'work') {
    head.innerHTML = '⚙ ' + esc(toolName(r.tool)) + ' is working';
    const secs = realElapsed ? realElapsed * p : null;
    body.innerHTML = `<div class="working"><div class="spinner"></div><div class="clock">${secs != null ? fmtS(secs) : '—'}</div><div class="note">${realElapsed ? `real run took ${fmtS(realElapsed)}` : 'elapsed time not recorded'}${r.tokens?.total ? ` · ${fmtN(Math.round(r.tokens.total * p))} tokens${r.tokens.provisional ? ' (provisional)' : ''}` : ''}</div></div>`;
  } else if (s.kind === 'edit') {
    const c = s.file;
    head.innerHTML = `✎ <span class="mono">${esc(c.path)}</span>`;
    const ck = 'edit' + c.path;
    if (!rp.cache[ck]) { const ops = lineDiff(c.before, c.after).filter((o) => o.t !== '='); rp.cache[ck] = ops; }
    const ops = rp.cache[ck], n = Math.ceil(ops.length * Math.min(1, p * 1.15));
    body.innerHTML = `<table class="dtable"><colgroup><col style="width:46px"><col style="width:16px"><col></colgroup>${ops.slice(0, n).map((o) => `<tr class="${o.t === '+' ? 'a' : 'd'}"><td class="ln">${o.t === '+' ? o.b : o.a}</td><td class="sg">${o.t}</td><td>${esc(o.s) || ' '}</td></tr>`).join('')}</table>${n < ops.length ? '<span class="caret"></span>' : ''}<p class="note">${ops.filter((o) => o.t === '+').length} added · ${ops.filter((o) => o.t === '-').length} removed · <a href="#" data-jump="diff">open full diff</a></p>`;
    body.scrollTop = body.scrollHeight;
  } else if (s.kind === 'report') {
    head.innerHTML = '📝 Agent final report';
    const txt = r.report || '(Final report not saved in all-runs for this run.)';
    body.innerHTML = `<div class="term">${esc(txt.slice(0, Math.floor(txt.length * Math.min(1, p * 1.3))))}</div>`;
    body.scrollTop = body.scrollHeight;
  } else if (s.kind === 'suite') {
    const su = s.suite;
    head.innerHTML = `🧪 ${esc(su.name)}`;
    const tests = su.tests.length ? su.tests : [{ ok: su.ok, depth: 0, name: su.verdict ? `scan ${su.verdict}` : `exit ${su.exit}` }];
    const n = Math.ceil(tests.length * Math.min(1, p * 1.2));
    const done = n >= tests.length && p > .85;
    // Only add the lines that are new since the last frame. Redrawing every line on each frame
    // replayed their fade-in animation and made the whole list flash.
    let term = body.querySelector(`.term[data-step="${i}"]`);
    if (!term) {
      body.innerHTML = `<div class="term" data-step="${i}"><div class="dim">$ run grader: ${esc(su.key)}</div><div class="lines"></div><div class="tail"></div></div>`;
      term = body.querySelector('.term'); term._n = 0; term._done = null;
    }
    const lines = term.querySelector('.lines');
    if (n < term._n) { lines.innerHTML = ''; term._n = 0; }
    if (n > term._n) {
      lines.insertAdjacentHTML('beforeend', tests.slice(term._n, n).map((t) => `<div class="line" style="padding-left:${t.depth * 6}px"><span class="${t.ok ? 'ok' : 'bad'}">${t.ok ? '✔' : '✖'}</span> ${esc(t.name)}</div>`).join(''));
      term._n = n;
    }
    if (term._done !== done) {
      term.querySelector('.tail').innerHTML = done ? `<div class="line hl" style="margin-top:6px">${su.pass != null ? `${su.pass} passed, ${su.fail} failed` : su.verdict || ''} · exit ${su.exit ?? '—'}</div>` : '<span class="caret"></span>';
      term._done = done;
    }
    body.scrollTop = body.scrollHeight;
  } else if (s.kind === 'traps') {
    head.innerHTML = '🛡 Prompt-injection traps';
    body.innerHTML = r.traps.map((t) => `<div class="trap line"><b>${esc(t.trap)}</b><span class="badge ${/not followed/i.test(t.result) ? 'pass' : 'fail'}">${esc(t.result)}</span><span class="note" style="grid-column:1/-1">${esc(t.disclosure)}</span></div>`).join('');
  } else {
    head.innerHTML = '🏁 Verdict';
    const ok = r.status === 'pass';
    body.innerHTML = `<div class="verdict"><div class="big ${ok ? 'ok' : 'bad'}">${ok ? 'PASSED' : 'FAILED'}</div><p>${r.suites.filter((x) => x.ok).length} of ${r.suites.length} grader suites passed · ${r.changed.length} files changed · ${fmtS(realElapsed)} · ${tokenLabel(r)} tokens</p>${!ok ? '<p class="note">Original attempt failed at least one independent check; see the README for any correction round.</p>' : ''}</div>`;
  }
  body.querySelectorAll('[data-jump]').forEach((a) => a.onclick = (e) => { e.preventDefault(); openRun(r.id, a.dataset.jump); });
}

// ---------- live app: starting app vs agent's app ----------
// Each app's real server.js runs in the page against a small Express stand-in, and its real
// index.html runs in a sandboxed frame whose fetch() is answered by that server. Nothing is
// sent anywhere. Data lives in memory and resets with "Reset data".
function makeLiveApp(src, modules = {}) {
  const routes = [], mws = [], errs = [];
  const app = { use(...a) { for (const f of a.filter((x) => typeof x === 'function')) { if (f.__skip) continue; (f.length === 4 ? errs : mws).push(f); } return app; },
    listen() { return { close() {} }; }, set() { return app; }, enable() { return app; }, disable() { return app; } };
  for (const m of ['get', 'post', 'put', 'patch', 'delete', 'all']) app[m] = (path, ...fns) => { routes.push({ m: m.toUpperCase(), path, fns: fns.flat() }); return app; };
  const skip = () => { const f = () => {}; f.__skip = true; return f; };
  const express = () => app;
  Object.assign(express, { json: skip, urlencoded: skip, static: skip, text: skip, raw: skip,
    Router() { throw new Error('express.Router is not supported in the live preview'); } });
  const pathMod = { join: (...p) => p.join('/'), resolve: (...p) => p.join('/'), dirname: (p) => p, basename: (p) => String(p).split(/[\\/]/).pop(), extname: () => '' };
  const module = { exports: {} };
  // Local modules (for example ./legacy/billing-export) load from the saved code, keyed by app path.
  const cache = {};
  const local = (n) => { const key = 'app/' + n.replace(/^\.\//, '').replace(/(\.js)?$/, '.js'); if (!(key in modules)) return null;
    if (!cache[key]) { const m = { exports: {} }; cache[key] = m; new Function('require', 'module', 'exports', modules[key])(req, m, m.exports); } return cache[key].exports; };
  const req = (n) => { if (n === 'express') return express; if (n === 'path' || n === 'node:path') return pathMod; const m = n.startsWith('./') && local(n); if (m) return m; throw new Error(`require('${n}') is not available in the live preview`); };
  req.main = {};
  let loadError = null;
  try { new Function('require', 'module', 'exports', 'process', '__dirname', '__filename', src)(req, module, module.exports, { env: {} }, '/app', '/app/server.js'); }
  catch (e) { loadError = e; }
  const toRe = (p) => new RegExp('^' + String(p).replace(/[.*+?^${}()|[\]\\]/g, '\\$&').replace(/\\?:([A-Za-z_]\w*)/g, (_, k) => `(?<${k}>[^/]+)`) + '/?$');
  routes.forEach((r) => { r.re = toRe(r.path); });

  function handle(d) {
    const u = new URL(d.url, 'http://app.local');
    let body = {}, parseError = null;
    if (d.body != null && d.body !== '') { try { body = JSON.parse(d.body); } catch (e) { parseError = Object.assign(new SyntaxError('Unexpected token in JSON'), { status: 400, statusCode: 400, type: 'entity.parse.failed', body: d.body }); } }
    const headers = Object.fromEntries(Object.entries(d.headers || {}).map(([k, v]) => [k.toLowerCase(), v]));
    return new Promise((resolve) => {
      let done = false;
      const finish = (status, text, type) => { if (done) return; done = true; resolve({ status, body: text, type }); };
      const reqObj = { method: d.method, url: u.pathname + u.search, originalUrl: u.pathname + u.search, path: u.pathname, query: Object.fromEntries(u.searchParams), params: {}, body, headers, get(h) { return headers[String(h).toLowerCase()]; } };
      const res = { statusCode: 200, headersSent: false, locals: {},
        status(c) { this.statusCode = c; return this; }, set() { return this; }, header() { return this; }, setHeader() { return this; }, type() { return this; },
        json(o) { finish(this.statusCode, JSON.stringify(o ?? null), 'application/json'); return this; },
        send(x) { if (x != null && typeof x === 'object') return this.json(x); finish(this.statusCode, x == null ? '' : String(x), 'text/html'); return this; },
        end(x) { finish(this.statusCode, x == null ? '' : String(x), 'text/plain'); return this; },
        sendStatus(c) { this.statusCode = c; finish(c, String(c), 'text/plain'); return this; } };
      const chain = [...mws.map((fn) => ({ fn })), ...routes.filter((r) => r.m === d.method || r.m === 'ALL').flatMap((r) => { const m = u.pathname.match(r.re); return m ? r.fns.map((fn) => ({ fn, params: m.groups || {} })) : []; })];
      let k = 0;
      const fail = (err) => {
        const h = errs.shift && errs.length ? errs : null;
        if (h) { let j = 0; const nextErr = (e2) => { const f = h[j++]; if (!f) return finish(e2?.status || 500, `Error: ${e2?.message || e2}`, 'text/plain'); try { f(e2, reqObj, res, nextErr); } catch (e3) { nextErr(e3); } }; return nextErr(err); }
        finish(err?.status || err?.statusCode || 500, `Error: ${err?.message || err}`, 'text/plain');
      };
      const next = (err) => {
        if (done) return;
        if (err) return fail(err);
        const step = chain[k++];
        if (!step) return finish(404, `Cannot ${d.method} ${u.pathname}`, 'text/plain');
        if (step.params) reqObj.params = Object.fromEntries(Object.entries(step.params).map(([a, b]) => [a, decodeURIComponent(b)]));
        try { const out = step.fn(reqObj, res, next); if (out && typeof out.catch === 'function') out.catch(next); } catch (e) { next(e); }
      };
      if (parseError) fail(parseError); else next();
      setTimeout(() => finish(500, 'The app did not respond within 3 seconds', 'text/plain'), 3000);
    });
  }
  return { handle, loadError, routes: routes.map((r) => `${r.m} ${r.path}`) };
}

const liveSides = {};
window.addEventListener('message', (e) => {
  const d = e.data;
  if (!d || typeof d.__live !== 'string' || !liveSides[d.__live]) return;
  const side = liveSides[d.__live];
  side.app.handle(d).then((resp) => {
    e.source.postMessage({ __live: d.__live, id: d.id, ...resp }, '*');
    const log = document.querySelector(`[data-log="${side.key}"]`);
    if (log) { log.insertAdjacentHTML('afterbegin', `<div class="${resp.status < 400 ? 'ok' : 'bad'}">${esc(d.method)} ${esc(new URL(d.url, 'http://app.local').pathname)} → ${resp.status}</div>`); }
  });
});

function liveBridge(token) {
  return `<script>(function(){var T=${JSON.stringify(token)},P={},n=0;
window.addEventListener('message',function(e){var d=e.data;if(!d||d.__live!==T||!P[d.id])return;var r=P[d.id];delete P[d.id];
var nb=d.status===204||d.status===205||d.status===304;r(new Response(nb?null:d.body,{status:d.status,headers:{'Content-Type':d.type||'text/plain'}}));});
window.fetch=function(u,o){o=o||{};var h=o.headers||{};if(typeof Headers!=='undefined'&&h instanceof Headers){var x={};h.forEach(function(v,k){x[k]=v});h=x;}
return new Promise(function(res){var id=++n;P[id]=res;parent.postMessage({__live:T,id:id,url:String(u&&u.url||u),method:String(o.method||'GET').toUpperCase(),body:o.body==null?null:String(o.body),headers:h},'*');});};})();<\/script>`;
}

function startLiveSide(key, label, server, html, modules) {
  const token = `${key}-${Date.now()}-${Math.random().toString(36).slice(2)}`;
  for (const t of Object.keys(liveSides)) if (liveSides[t].key === key) delete liveSides[t];
  const app = makeLiveApp(server || '', modules);
  liveSides[token] = { key, app };
  const frame = document.querySelector(`iframe[data-side="${key}"]`);
  const page = html || '<p>No index.html.</p>';
  frame.srcdoc = /<head[^>]*>/i.test(page) ? page.replace(/<head[^>]*>/i, (m) => m + liveBridge(token)) : liveBridge(token) + page;
  const log = document.querySelector(`[data-log="${key}"]`);
  if (log) log.innerHTML = app.loadError ? `<div class="bad">server.js failed to load: ${esc(app.loadError.message)}</div>` : '';
  return app;
}

function renderLive() {
  const r = current, t = task(r.task), body = $('#dBody');
  const base = t.app || {};
  const after = (p) => r.changed.find((x) => x.path === p)?.after;
  const sides = [
    { key: 'before', label: 'Starting app', server: base.server, html: base.html, modules: base.modules || {} },
    { key: 'after', label: `${toolName(r.tool)}'s app`, server: after('app/server.js') ?? base.server, html: after('app/public/index.html') ?? base.html,
      modules: Object.fromEntries(Object.entries(base.modules || {}).map(([m, src]) => [m, after(m) ?? src])) },
  ];
  body.innerHTML = `<p class="note">Both apps run here in your browser, from the saved code: the real <code>server.js</code> behind a small Express stand-in, and the real page. Try the same actions in both to see what the agent added or removed. Data is kept in memory; nothing is sent anywhere.</p>
    <div class="live-grid">${sides.map((x) => `<div class="live-col"><div class="live-head"><b>${esc(x.label)}</b><button class="btn" data-reset="${x.key}">Reset data</button></div>
      <iframe sandbox="allow-scripts allow-forms allow-modals" data-side="${x.key}" title="${esc(x.label)}"></iframe>
      <div class="live-log" data-log="${x.key}" aria-live="polite"></div></div>`).join('')}</div>
    <div class="box" id="liveDiff"></div>`;
  const apps = {};
  for (const x of sides) apps[x.key] = startLiveSide(x.key, x.label, x.server, x.html, x.modules);
  body.querySelectorAll('[data-reset]').forEach((b) => b.onclick = () => { const x = sides.find((y) => y.key === b.dataset.reset); apps[x.key] = startLiveSide(x.key, x.label, x.server, x.html, x.modules); });

  // What was added and removed: API routes, page controls, and line counts per file.
  const added = apps.after.routes.filter((x) => !apps.before.routes.includes(x));
  const removed = apps.before.routes.filter((x) => !apps.after.routes.includes(x));
  const controls = (h) => { const m = (h || '').match(/<(button|input|select|textarea|label)\b[^>]*>/gi) || []; return m.length; };
  const lines = r.changed.map((ch) => { const o = lineDiff(ch.before, ch.after); return `<div class="t"><span class="ic note">•</span><span><code>${esc(ch.path)}</code>: <span style="color:var(--ok)">+${o.filter((y) => y.t === '+').length}</span> <span style="color:var(--danger)">−${o.filter((y) => y.t === '-').length}</span> lines</span></div>`; }).join('');
  $('#liveDiff').innerHTML = `<h4>What the agent added and removed</h4>
    ${added.length ? added.map((x) => `<div class="t ok"><span class="ic">+</span><span>New API route <code>${esc(x)}</code></span></div>`).join('') : '<div class="t"><span class="ic note">○</span><span>No new API routes</span></div>'}
    ${removed.map((x) => `<div class="t bad"><span class="ic">−</span><span>Removed API route <code>${esc(x)}</code></span></div>`).join('')}
    <div class="t"><span class="ic note">•</span><span>Page controls (buttons, inputs, selects, labels in the page source): ${controls(sides[0].html)} → ${controls(sides[1].html)}</span></div>
    ${lines || '<div class="t"><span class="ic note">○</span><span>No app files changed</span></div>'}
    <p class="note"><a href="#" data-jump="diff">Open the full code diff</a></p>`;
  $('#liveDiff').querySelectorAll('[data-jump]').forEach((a) => a.onclick = (e) => { e.preventDefault(); openRun(r.id, 'diff'); });
}

// ---------- theme ----------
$('#themeBtn').onclick = $('#sideThemeBtn').onclick = () => {
  const cur = document.documentElement.dataset.theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
  document.documentElement.dataset.theme = cur === 'light' ? 'dark' : 'light';
  try { localStorage.setItem('bench-theme', document.documentElement.dataset.theme); } catch {}
};
try { const t = localStorage.getItem('bench-theme'); if (t) document.documentElement.dataset.theme = t; } catch {}

renderFilters(); render();
animateIn(SECTIONS.find((x) => x.dataset.sec === page));
if (page === 'scores') animatePodium();
const h = new URLSearchParams(location.hash.slice(1));
if (h.get('run')) openRun(h.get('run'), h.get('tab') || 'overview');
else if (h.get('task')) openTask(h.get('task'), h.get('tab') || 'compare');
else if (h.get('sec')) showPage(h.get('sec'));
})();
</script>
