<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Baseline Test Application</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      font-family: system-ui, -apple-system, sans-serif;
      max-width: 600px;
      margin: 40px auto;
      padding: 0 20px;
      color: #222;
      background: #f8f9fa;
    }
    
    .container {
      background: white;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0, 0, 0, 0.1);
      padding: 30px;
    }
    
    h1 {
      color: #006747;
      border-bottom: 3px solid #006747;
      padding-bottom: 12px;
      margin-bottom: 20px;
      font-size: 1.8rem;
    }
    
    .info {
      background: #f0f8f5;
      padding: 12px;
      border-left: 4px solid #006747;
      margin-bottom: 20px;
      border-radius: 4px;
      font-size: 0.9rem;
      color: #333;
    }
    
    form {
      display: flex;
      gap: 8px;
      margin: 20px 0;
    }
    
    input {
      flex: 1;
      padding: 12px;
      border: 2px solid #ddd;
      border-radius: 4px;
      font-size: 1rem;
      transition: border-color 0.3s;
    }
    
    input:focus {
      outline: none;
      border-color: #006747;
    }
    
    button {
      padding: 12px 24px;
      background: #006747;
      color: white;
      border: none;
      border-radius: 4px;
      cursor: pointer;
      font-weight: 600;
      font-size: 1rem;
      transition: background 0.3s;
    }
    
    button:hover {
      background: #005239;
    }
    
    button:active {
      transform: scale(0.98);
    }
    
    ul {
      list-style: none;
      margin-top: 20px;
    }
    
    li {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 14px 12px;
      border-bottom: 1px solid #eee;
      transition: background 0.2s;
    }
    
    li:hover {
      background: #f8f9fa;
    }
    
    li:last-child {
      border-bottom: none;
    }
    
    .item-text {
      cursor: pointer;
      flex: 1;
      padding-right: 10px;
      word-break: break-word;
    }
    
    .item-text.done {
      text-decoration: line-through;
      color: #999;
    }
    
    .delete-btn {
      background: #dc3545;
      padding: 8px 12px;
      font-size: 0.85rem;
      white-space: nowrap;
    }
    
    .delete-btn:hover {
      background: #c82333;
    }
    
    .empty-state {
      text-align: center;
      padding: 40px 20px;
      color: #999;
      font-size: 1.1rem;
    }
    
    .loading {
      text-align: center;
      padding: 20px;
      color: #666;
    }
  </style>
</head>
<body>
  <div class="container">
    <h1>📋 Baseline Test Application</h1>
    
    <div class="info">
      <strong>Purpose:</strong> Standardized baseline for benchmarking AI model capabilities in software engineering tasks.
    </div>
    
    <form id="todo-form">
      <input id="todo-input" placeholder="Enter task requirement..." required />
      <button type="submit">Add Task</button>
    </form>
    
    <div id="content">
      <div class="loading">Loading tasks...</div>
    </div>
  </div>

  <script>
    const contentDiv = document.getElementById('content');
    
    async function renderTodos() {
      try {
        const res = await fetch('/api/todos');
        if (!res.ok) throw new Error(`API error: ${res.status}`);
        
        const todos = await res.json();
        
        if (todos.length === 0) {
          contentDiv.innerHTML = '<div class="empty-state">No tasks yet. Add one to get started! 👆</div>';
          return;
        }
        
        contentDiv.innerHTML = `
          <ul id="todo-list">
            ${todos.map(todo => `
              <li>
                <span class="item-text ${todo.completed ? 'done' : ''}" onclick="toggleStatus(${todo.id}, ${!todo.completed})">
                  ${escapeHtml(todo.title)}
                </span>
                <button class="delete-btn" onclick="deleteItem(${todo.id})">Delete</button>
              </li>
            `).join('')}
          </ul>
        `;
      } catch (error) {
        contentDiv.innerHTML = `<div class="empty-state" style="color: #dc3545;">Error loading tasks: ${error.message}</div>`;
      }
    }
    
    document.getElementById('todo-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      const title = input.value.trim();
      
      if (!title) {
        alert('Task cannot be empty');
        return;
      }
      
      try {
        const res = await fetch('/api/todos', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        
        if (!res.ok) {
          const error = await res.json();
          throw new Error(error.error || 'Failed to create task');
        }
        
        input.value = '';
        renderTodos();
      } catch (error) {
        alert('Error: ' + error.message);
      }
    };
    
    async function toggleStatus(id, completed) {
      try {
        const res = await fetch(`/api/todos/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed })
        });
        
        if (!res.ok) throw new Error('Failed to update task');
        renderTodos();
      } catch (error) {
        alert('Error: ' + error.message);
      }
    }
    
    async function deleteItem(id) {
      if (!confirm('Are you sure you want to delete this task?')) return;
      
      try {
        const res = await fetch(`/api/todos/${id}`, { method: 'DELETE' });
        if (!res.ok) throw new Error('Failed to delete task');
        renderTodos();
      } catch (error) {
        alert('Error: ' + error.message);
      }
    }
    
    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }
    
    // Initial load
    renderTodos();
  </script>
</body>
</html>
