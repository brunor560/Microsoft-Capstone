<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo Benchmark Baseline</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 550px; margin: 50px auto; padding: 0 20px; color: #222; }
    h1 { color: #006747; border-bottom: 2px solid #006747; padding-bottom: 8px; }
    form { display: flex; gap: 8px; margin: 20px 0; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    button { padding: 10px 18px; background: #006747; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 12px 8px; border-bottom: 1px solid #eee; flex-wrap: wrap; }
    .item-text { cursor: pointer; flex: 1; }
    .done { text-decoration: line-through; color: #888; }
    .delete-btn { background: #d9534f; padding: 6px 10px; font-size: 0.85rem; }
    .error-msg { color: #d9534f; font-size: 0.85rem; width: 100%; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Baseline Test Application</h1>
  <form id="todo-form">
    <input id="todo-input" placeholder="Enter task requirement..." required />
    <button type="submit">Add Task</button>
  </form>
  <ul id="todo-list"></ul>

  <script>
    const list = document.getElementById('todo-list');
    async function fetchTodos() {
      const res = await fetch('/api/todos');
      const data = await res.json();
      list.innerHTML = data.map(item => `
        <li id="todo-item-${item.id}">
          <span class="item-text ${item.completed ? 'done' : ''}" onclick="toggleStatus(${item.id}, ${!item.completed})">
            ${item.title}
          </span>
          <button class="delete-btn" onclick="deleteItem(${item.id})">Delete</button>
        </li>
      `).join('');
    }
    document.getElementById('todo-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });
      input.value = '';
      fetchTodos();
    };
    async function toggleStatus(id, completed) {
      // UI-03: remember original state before the click so we can roll back on failure
      const li = document.getElementById('todo-item-' + id);
      const span = li ? li.querySelector('.item-text') : null;
      const wasCompleted = !completed; // completed is the NEW desired state, so old state is the opposite

      try {
        const res = await fetch(`/api/todos/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ completed })
        });
        if (!res.ok) {
          // HTTP error — show error message and keep original state
          const data = await res.json().catch(() => ({}));
          const msg = (data && data.error) ? data.error : `Request failed (HTTP ${res.status})`;
          showToggleError(li, msg);
          return;
        }
        // Success — refresh the list
        fetchTodos();
      } catch (err) {
        // Network error — server unreachable
        showToggleError(li, 'Could not reach the server. Please try again.');
      }
    }
    function showToggleError(li, message) {
      if (!li) return;
      // Remove any existing alert in this li
      const existing = li.querySelector('[role="alert"]');
      if (existing) existing.remove();
      const alert = document.createElement('span');
      alert.setAttribute('role', 'alert');
      alert.className = 'error-msg';
      alert.textContent = message;
      li.appendChild(alert);
    }
    async function deleteItem(id) {
      await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      fetchTodos();
    }
    fetchTodos();
  </script>
</body>
</html>
