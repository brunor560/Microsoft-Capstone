<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo Benchmark Baseline</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 550px; margin: 50px auto; padding: 0 20px; color: #222; }
    h1 { color: #006747; border-bottom: 2px solid #006747; padding-bottom: 8px; }
    form { display: flex; gap: 8px; margin: 20px 0; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    button { padding: 10px 18px; background: #006747; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    ul { list-style: none; padding: 0; }
    li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 12px 8px; border-bottom: 1px solid #eee; }
    .item-text { cursor: pointer; flex: 1; }
    .done { text-decoration: line-through; color: #888; }
    .delete-btn { background: #d9534f; padding: 6px 10px; font-size: 0.85rem; }
    .edit-btn { background: #555; padding: 6px 10px; font-size: 0.85rem; margin-right: 4px; }
    .edit-row { display: none; width: 100%; margin-top: 8px; gap: 6px; align-items: center; flex-wrap: wrap; }
    .edit-row input { flex: 1; padding: 6px 10px; font-size: 0.95rem; }
    .edit-row button { padding: 6px 12px; font-size: 0.85rem; }
    .cancel-btn { background: #888; }
    .error-msg { width: 100%; color: #c0392b; font-size: 0.9rem; margin-top: 4px; }
    .error-msg:empty { display: none; }
  </style>
</head>
<body>
  <h1>Baseline Test Application</h1>
  <form id="todo-form">
    <input id="todo-input" placeholder="Enter task requirement..." required />
    <button type="submit">Add Task</button>
  </form>
  <ul id="todo-list"></ul>

  <script>
    const list = document.getElementById('todo-list');

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;');
    }

    async function fetchTodos() {
      const res = await fetch('/api/todos');
      const data = await res.json();
      list.innerHTML = data.map(item => `
        <li data-todo-id="${item.id}">
          <span class="item-text ${item.completed ? 'done' : ''}" onclick="toggleStatus(${item.id}, ${!item.completed})">
            ${escapeHtml(item.title)}
          </span>
          <div class="actions">
            <button class="edit-btn" onclick="startEdit(${item.id})">Edit</button>
            <button class="delete-btn" onclick="deleteItem(${item.id})">Delete</button>
          </div>
          <div class="edit-row">
            <input aria-label="Edit title" value="${escapeHtml(item.title)}" />
            <button onclick="saveEdit(${item.id})">Save</button>
            <button class="cancel-btn" onclick="cancelEdit(${item.id})">Cancel</button>
            <div role="alert" class="error-msg"></div>
          </div>
        </li>
      `).join('');
    }

    function getLi(id) {
      return document.querySelector(`li[data-todo-id="${id}"]`);
    }

    function startEdit(id) {
      const li = getLi(id);
      li.querySelector('.item-text').style.display = 'none';
      li.querySelector('.actions').style.display = 'none';
      const editRow = li.querySelector('.edit-row');
      editRow.style.display = 'flex';
      editRow.querySelector('input').focus();
    }

    function cancelEdit(id) {
      const li = getLi(id);
      li.querySelector('.item-text').style.display = '';
      li.querySelector('.actions').style.display = '';
      li.querySelector('.edit-row').style.display = 'none';
      li.querySelector('.error-msg').textContent = '';
    }

    async function saveEdit(id) {
      const li = getLi(id);
      const input = li.querySelector('input[aria-label="Edit title"]');
      const title = input.value.trim();
      const alertEl = li.querySelector('.error-msg');

      if (!title) {
        alertEl.textContent = 'Title cannot be empty.';
        return;
      }

      try {
        const res = await fetch(`/api/todos/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title })
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          alertEl.textContent = data.error || 'Failed to save. Please try again.';
          return;
        }
        fetchTodos();
      } catch (_err) {
        alertEl.textContent = 'Network error. Please try again.';
      }
    }

    document.getElementById('todo-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });
      input.value = '';
      fetchTodos();
    };

    async function toggleStatus(id, completed) {
      await fetch(`/api/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      fetchTodos();
    }

    async function deleteItem(id) {
      await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      fetchTodos();
    }

    fetchTodos();
  </script>
</body>
</html>
