<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo Benchmark Baseline</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 550px; margin: 50px auto; padding: 0 20px; color: #222; }
    h1 { color: #006747; border-bottom: 2px solid #006747; padding-bottom: 8px; }
    form { display: flex; gap: 8px; margin: 20px 0; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    button { padding: 10px 18px; background: #006747; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    ul { list-style: none; padding: 0; }
    li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 8px; border-bottom: 1px solid #eee; }
    .item-text { cursor: pointer; flex: 1; text-align: left; background: transparent; color: inherit; padding: 6px 0; }
    .item-text:hover { background: transparent; }
    .done { text-decoration: line-through; color: #888; }
    .delete-btn { background: #d9534f; padding: 6px 10px; font-size: 0.85rem; }
    .todo-controls { display: flex; gap: 6px; }
    .todo-controls button { padding: 6px 10px; font-size: 0.85rem; }
    .edit-form { display: flex; flex: 1 1 100%; gap: 8px; margin: 0; }
    .edit-form input { min-width: 0; }
    .error-message { flex: 1 1 100%; color: #b42318; margin: 0; }
    [hidden] { display: none !important; }
  </style>
</head>
<body>
  <h1>Baseline Test Application</h1>
  <form id="todo-form">
    <input id="todo-input" placeholder="Enter task requirement..." required />
    <button type="submit">Add Task</button>
  </form>
  <ul id="todo-list"></ul>

  <script>
    const list = document.getElementById('todo-list');
    let todos = [];
    const editors = new Map();

    function renderTodos() {
      list.replaceChildren();
      for (const item of todos) {
        const row = document.createElement('li');
        row.dataset.todoId = item.id;

        const editor = editors.get(item.id);
        if (editor) {
          const form = document.createElement('form');
          form.className = 'edit-form';
          const input = document.createElement('input');
          input.type = 'text';
          input.setAttribute('aria-label', 'Edit title');
          input.value = editor.draft;
          const save = document.createElement('button');
          save.type = 'submit';
          save.textContent = 'Save';
          const cancel = document.createElement('button');
          cancel.type = 'button';
          cancel.textContent = 'Cancel';
          const error = document.createElement('p');
          error.className = 'error-message';
          error.setAttribute('role', 'alert');
          error.hidden = !editor.error;
          error.textContent = editor.error;

          input.addEventListener('input', () => {
            editor.draft = input.value;
          });
          form.addEventListener('submit', async (event) => {
            event.preventDefault();
            const title = input.value.trim();
            editor.draft = input.value;
            if (!title) {
              editor.error = 'Title cannot be empty.';
              renderTodos();
              return;
            }
            try {
              const response = await fetch(`/api/todos/${item.id}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ title })
              });
              if (!response.ok) throw new Error('Save request failed');
              const updated = await response.json();
              todos = todos.map(todo => todo.id === updated.id ? updated : todo);
              editors.delete(item.id);
              renderTodos();
            } catch {
              editor.error = 'Could not save title. Please try again.';
              renderTodos();
            }
          });
          cancel.addEventListener('click', () => {
            editors.delete(item.id);
            renderTodos();
          });

          form.append(input, save, cancel);
          row.append(form, error);
        } else {
          const title = document.createElement('button');
          title.type = 'button';
          title.className = `item-text${item.completed ? ' done' : ''}`;
          title.textContent = item.title;
          title.addEventListener('click', () => toggleStatus(item.id, !item.completed));

          const controls = document.createElement('div');
          controls.className = 'todo-controls';
          const edit = document.createElement('button');
          edit.type = 'button';
          edit.textContent = 'Edit';
          edit.addEventListener('click', () => {
            editors.set(item.id, { draft: item.title, error: '' });
            renderTodos();
            list.querySelector(`li[data-todo-id="${item.id}"] [aria-label="Edit title"]`).focus();
          });
          const remove = document.createElement('button');
          remove.type = 'button';
          remove.className = 'delete-btn';
          remove.textContent = 'Delete';
          remove.addEventListener('click', () => deleteItem(item.id));

          controls.append(edit, remove);
          row.append(title, controls);
        }
        list.append(row);
      }
    }

    async function fetchTodos() {
      const res = await fetch('/api/todos');
      todos = await res.json();
      renderTodos();
    }
    document.getElementById('todo-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });
      input.value = '';
      fetchTodos();
    };
    async function toggleStatus(id, completed) {
      await fetch(`/api/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      fetchTodos();
    }
    async function deleteItem(id) {
      await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      fetchTodos();
    }
    fetchTodos();
  </script>
</body>
</html>
