<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo Benchmark Baseline</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 550px; margin: 50px auto; padding: 0 20px; color: #222; }
    h1 { color: #006747; border-bottom: 2px solid #006747; padding-bottom: 8px; }
    form { display: flex; flex-direction: column; gap: 8px; margin: 20px 0; }
    .form-row { display: flex; gap: 8px; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    label { font-size: 0.9rem; font-weight: 600; }
    textarea { width: 100%; padding: 8px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; box-sizing: border-box; resize: vertical; }
    button { padding: 10px 18px; background: #006747; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 8px; border-bottom: 1px solid #eee; }
    .item-body { flex: 1; }
    .item-text { cursor: pointer; }
    .done { text-decoration: line-through; color: #888; }
    .notes { font-size: 0.9rem; color: #555; margin-top: 4px; }
    .delete-btn { background: #d9534f; padding: 6px 10px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Baseline Test Application</h1>
  <form id="todo-form">
    <div class="form-row">
      <input id="todo-input" placeholder="Enter task requirement..." required />
      <button type="submit">Add Task</button>
    </div>
    <label for="notes-input">Notes</label>
    <textarea id="notes-input" rows="3"></textarea>
  </form>
  <ul id="todo-list"></ul>

  <script>
    const list = document.getElementById('todo-list');

    function formatNotes(raw) {
      const esc = s => s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
      return raw.split('\n').map(line => {
        let out = '', last = 0;
        const re = /\*\*([^*]+)\*\*|\[([^\]]+)\]\((https?:\/\/[^)]+)\)/g;
        let m;
        while ((m = re.exec(line)) !== null) {
          out += esc(line.slice(last, m.index));
          out += m[1] !== undefined
            ? `<strong>${esc(m[1])}</strong>`
            : `<a href="${esc(m[3])}">${esc(m[2])}</a>`;
          last = m.index + m[0].length;
        }
        return out + esc(line.slice(last));
      }).join('<br>');
    }

    async function fetchTodos() {
      const res = await fetch('/api/todos');
      const data = await res.json();
      list.innerHTML = data.map(item => `
        <li>
          <div class="item-body">
            <span class="item-text ${item.completed ? 'done' : ''}" onclick="toggleStatus(${item.id}, ${!item.completed})">
              ${item.title}
            </span>
            ${item.notes ? `<div class="notes">${formatNotes(item.notes)}</div>` : ''}
          </div>
          <button class="delete-btn" onclick="deleteItem(${item.id})">Delete</button>
        </li>
      `).join('');
    }
    document.getElementById('todo-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      const notesInput = document.getElementById('notes-input');
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value, notes: notesInput.value })
      });
      input.value = '';
      notesInput.value = '';
      fetchTodos();
    };
    async function toggleStatus(id, completed) {
      await fetch(`/api/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      fetchTodos();
    }
    async function deleteItem(id) {
      await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      fetchTodos();
    }
    fetchTodos();
  </script>
</body>
</html>
