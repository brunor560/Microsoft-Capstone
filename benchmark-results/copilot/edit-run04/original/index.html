<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo Benchmark Baseline</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 550px; margin: 50px auto; padding: 0 20px; color: #222; }
    h1 { color: #006747; border-bottom: 2px solid #006747; padding-bottom: 8px; }
    form { display: flex; gap: 8px; margin: 20px 0; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    button { padding: 10px 18px; background: #006747; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 12px 8px; border-bottom: 1px solid #eee; flex-wrap: wrap; gap: 4px; }
    .item-text { cursor: pointer; flex: 1; }
    .done { text-decoration: line-through; color: #888; }
    .delete-btn { background: #d9534f; padding: 6px 10px; font-size: 0.85rem; }
    .edit-btn { background: #0066cc; padding: 6px 10px; font-size: 0.85rem; }
    .save-btn { padding: 6px 10px; font-size: 0.85rem; }
    .cancel-btn { background: #666; padding: 6px 10px; font-size: 0.85rem; }
    .edit-controls { display: flex; gap: 4px; align-items: center; flex-wrap: wrap; width: 100%; }
    .edit-input { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    .item-alert { color: #d9534f; font-size: 0.85rem; width: 100%; margin-top: 2px; }
  </style>
</head>
<body>
  <h1>Baseline Test Application</h1>
  <form id="todo-form">
    <input id="todo-input" placeholder="Enter task requirement..." required />
    <button type="submit">Add Task</button>
  </form>
  <ul id="todo-list"></ul>

  <script>
    const list = document.getElementById('todo-list');

    function createTodoLi(item) {
      const li = document.createElement('li');
      li.dataset.todoId = item.id;

      const span = document.createElement('span');
      span.className = 'item-text' + (item.completed ? ' done' : '');
      span.textContent = item.title;
      span.addEventListener('click', () => toggleStatus(item.id, !item.completed));

      const editBtn = document.createElement('button');
      editBtn.className = 'edit-btn';
      editBtn.textContent = 'Edit';

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = 'Delete';
      deleteBtn.addEventListener('click', () => deleteItem(item.id));

      const editControls = document.createElement('div');
      editControls.className = 'edit-controls';
      editControls.style.display = 'none';

      const editInput = document.createElement('input');
      editInput.className = 'edit-input';
      editInput.setAttribute('aria-label', 'Edit title');

      const saveBtn = document.createElement('button');
      saveBtn.className = 'save-btn';
      saveBtn.textContent = 'Save';

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'cancel-btn';
      cancelBtn.textContent = 'Cancel';

      const alertEl = document.createElement('div');
      alertEl.setAttribute('role', 'alert');
      alertEl.className = 'item-alert';
      alertEl.style.display = 'none';

      editControls.appendChild(editInput);
      editControls.appendChild(saveBtn);
      editControls.appendChild(cancelBtn);

      li.appendChild(span);
      li.appendChild(editBtn);
      li.appendChild(deleteBtn);
      li.appendChild(editControls);
      li.appendChild(alertEl);

      editBtn.addEventListener('click', () => {
        editInput.value = span.textContent;
        alertEl.textContent = '';
        alertEl.style.display = 'none';
        editControls.style.display = 'flex';
        span.style.display = 'none';
        editBtn.style.display = 'none';
        deleteBtn.style.display = 'none';
        editInput.focus();
      });

      cancelBtn.addEventListener('click', () => {
        editControls.style.display = 'none';
        span.style.display = '';
        editBtn.style.display = '';
        deleteBtn.style.display = '';
        alertEl.style.display = 'none';
      });

      saveBtn.addEventListener('click', () => saveEdit(li, item.id, editInput, alertEl, span, editControls, editBtn, deleteBtn));

      return li;
    }

    async function saveEdit(li, id, editInput, alertEl, span, editControls, editBtn, deleteBtn) {
      const trimmed = editInput.value.trim();
      if (!trimmed) {
        alertEl.textContent = 'Title cannot be empty.';
        alertEl.style.display = '';
        return;
      }
      try {
        const res = await fetch(`/api/todos/${id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: editInput.value })
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          alertEl.textContent = data.error || 'Failed to save. Please try again.';
          alertEl.style.display = '';
          return;
        }
        const updated = await res.json();
        span.textContent = updated.title;
        editControls.style.display = 'none';
        span.style.display = '';
        editBtn.style.display = '';
        deleteBtn.style.display = '';
        alertEl.style.display = 'none';
      } catch (_err) {
        alertEl.textContent = 'Network error. Please try again.';
        alertEl.style.display = '';
      }
    }

    async function fetchTodos() {
      const res = await fetch('/api/todos');
      const data = await res.json();
      list.innerHTML = '';
      data.forEach(item => list.appendChild(createTodoLi(item)));
    }

    document.getElementById('todo-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });
      input.value = '';
      fetchTodos();
    };

    async function toggleStatus(id, completed) {
      await fetch(`/api/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      fetchTodos();
    }

    async function deleteItem(id) {
      await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      fetchTodos();
    }

    fetchTodos();
  </script>
</body>
</html>
