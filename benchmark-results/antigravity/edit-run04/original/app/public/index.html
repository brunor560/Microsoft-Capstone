<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo Benchmark Baseline</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 550px; margin: 50px auto; padding: 0 20px; color: #222; }
    h1 { color: #006747; border-bottom: 2px solid #006747; padding-bottom: 8px; }
    form { display: flex; gap: 8px; margin: 20px 0; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    button { padding: 10px 18px; background: #006747; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 12px 8px; border-bottom: 1px solid #eee; flex-wrap: wrap; }
    .item-text { cursor: pointer; flex: 1; }
    .done { text-decoration: line-through; color: #888; }
    .delete-btn { background: #d9534f; padding: 6px 10px; font-size: 0.85rem; }
    .edit-btn { background: #0275d8; padding: 6px 10px; font-size: 0.85rem; margin-right: 4px; }
    .edit-controls { display: flex; gap: 6px; align-items: center; width: 100%; margin-top: 6px; flex-wrap: wrap; }
    .edit-input { flex: 1; padding: 6px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    .save-btn { background: #5cb85c; padding: 6px 10px; font-size: 0.85rem; }
    .cancel-btn { background: #777; padding: 6px 10px; font-size: 0.85rem; }
    [role="alert"] { color: #c0392b; font-size: 0.85rem; width: 100%; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Baseline Test Application</h1>
  <form id="todo-form">
    <input id="todo-input" placeholder="Enter task requirement..." required />
    <button type="submit">Add Task</button>
  </form>
  <ul id="todo-list"></ul>

  <script>
    const list = document.getElementById('todo-list');

    function createTodoItem(item) {
      const li = document.createElement('li');
      li.dataset.todoId = item.id;

      const span = document.createElement('span');
      span.className = 'item-text' + (item.completed ? ' done' : '');
      span.textContent = item.title;
      span.addEventListener('click', () => toggleStatus(item.id, !item.completed));

      const editBtn = document.createElement('button');
      editBtn.className = 'edit-btn';
      editBtn.textContent = 'Edit';
      editBtn.addEventListener('click', () => openEditor(li, item));

      const deleteBtn = document.createElement('button');
      deleteBtn.className = 'delete-btn';
      deleteBtn.textContent = 'Delete';
      deleteBtn.addEventListener('click', () => deleteItem(item.id));

      li.appendChild(span);
      li.appendChild(editBtn);
      li.appendChild(deleteBtn);

      return li;
    }

    function openEditor(li, item) {
      // Remove any existing edit controls
      const existing = li.querySelector('.edit-controls');
      if (existing) existing.remove();
      const existingAlert = li.querySelector('[role="alert"]');
      if (existingAlert) existingAlert.remove();

      const controls = document.createElement('div');
      controls.className = 'edit-controls';

      const input = document.createElement('input');
      input.className = 'edit-input';
      input.setAttribute('aria-label', 'Edit title');
      input.value = item.title;

      const saveBtn = document.createElement('button');
      saveBtn.className = 'save-btn';
      saveBtn.textContent = 'Save';

      const cancelBtn = document.createElement('button');
      cancelBtn.className = 'cancel-btn';
      cancelBtn.textContent = 'Cancel';

      const alert = document.createElement('div');
      alert.setAttribute('role', 'alert');
      alert.style.display = 'none';

      saveBtn.addEventListener('click', () => saveEdit(li, item, input, alert));
      cancelBtn.addEventListener('click', () => closeEditor(li));

      input.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') saveEdit(li, item, input, alert);
        if (e.key === 'Escape') closeEditor(li);
      });

      controls.appendChild(input);
      controls.appendChild(saveBtn);
      controls.appendChild(cancelBtn);
      li.appendChild(controls);
      li.appendChild(alert);
      input.focus();
    }

    async function saveEdit(li, item, input, alert) {
      const trimmed = input.value.trim();
      if (!trimmed) {
        alert.textContent = 'Title cannot be empty.';
        alert.style.display = '';
        return;
      }
      alert.style.display = 'none';

      let updated;
      try {
        const res = await fetch(`/api/todos/${item.id}`, {
          method: 'PUT',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ title: input.value })
        });
        if (!res.ok) {
          const data = await res.json().catch(() => ({}));
          alert.textContent = data.error || `Error: ${res.status}`;
          alert.style.display = '';
          return;
        }
        updated = await res.json();
      } catch (err) {
        alert.textContent = 'Network error. Please try again.';
        alert.style.display = '';
        return;
      }

      const newLi = createTodoItem(updated);
      li.replaceWith(newLi);
    }

    function closeEditor(li) {
      const controls = li.querySelector('.edit-controls');
      if (controls) controls.remove();
      const alertEl = li.querySelector('[role="alert"]');
      if (alertEl) alertEl.remove();
    }

    async function fetchTodos() {
      const res = await fetch('/api/todos');
      const data = await res.json();
      list.innerHTML = '';
      data.forEach(item => list.appendChild(createTodoItem(item)));
    }

    document.getElementById('todo-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });
      input.value = '';
      fetchTodos();
    };

    async function toggleStatus(id, completed) {
      await fetch(`/api/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      fetchTodos();
    }

    async function deleteItem(id) {
      await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      fetchTodos();
    }

    fetchTodos();
  </script>
</body>
</html>
