<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo Benchmark Baseline</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 550px; margin: 50px auto; padding: 0 20px; color: #222; }
    h1 { color: #006747; border-bottom: 2px solid #006747; padding-bottom: 8px; }
    form { display: flex; gap: 8px; margin: 20px 0; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    button { padding: 10px 18px; background: #006747; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    ul { list-style: none; padding: 0; }
    li { display: flex; flex-wrap: wrap; justify-content: space-between; align-items: center; padding: 12px 8px; border-bottom: 1px solid #eee; gap: 6px; }
    .item-text { cursor: pointer; flex: 1; }
    .done { text-decoration: line-through; color: #888; }
    .delete-btn { background: #d9534f; padding: 6px 10px; font-size: 0.85rem; }
    .edit-btn { background: #5b7fa6; padding: 6px 10px; font-size: 0.85rem; }
    .edit-area { display: flex; flex-wrap: wrap; gap: 6px; width: 100%; align-items: center; }
    .edit-input { flex: 1; padding: 6px 8px; border: 1px solid #aaa; border-radius: 4px; font-size: 1rem; }
    .save-btn { background: #006747; padding: 6px 10px; font-size: 0.85rem; }
    .cancel-btn { background: #888; padding: 6px 10px; font-size: 0.85rem; }
    .error-msg { color: #c00; font-size: 0.85rem; width: 100%; }
  </style>
</head>
<body>
  <h1>Baseline Test Application</h1>
  <form id="todo-form">
    <input id="todo-input" placeholder="Enter task requirement..." required />
    <button type="submit">Add Task</button>
  </form>
  <ul id="todo-list"></ul>

  <script>
    const list = document.getElementById('todo-list');

    function escapeHtml(str) {
      return str
        .replace(/&/g, '&amp;')
        .replace(/</g, '&lt;')
        .replace(/>/g, '&gt;')
        .replace(/"/g, '&quot;')
        .replace(/'/g, '&#39;');
    }

    async function fetchTodos() {
      const res = await fetch('/api/todos');
      const data = await res.json();
      renderTodos(data);
    }

    function renderTodos(data) {
      list.innerHTML = '';
      data.forEach(item => {
        const li = document.createElement('li');
        li.setAttribute('data-todo-id', item.id);
        li.innerHTML = `
          <span class="item-text ${item.completed ? 'done' : ''}">${escapeHtml(item.title)}</span>
          <button class="edit-btn" type="button">Edit</button>
          <button class="delete-btn" type="button">Delete</button>
        `;

        const span = li.querySelector('.item-text');
        span.addEventListener('click', () => toggleStatus(item.id, !item.completed));

        const editBtn = li.querySelector('.edit-btn');
        editBtn.addEventListener('click', () => openEditor(li, item));

        const deleteBtn = li.querySelector('.delete-btn');
        deleteBtn.addEventListener('click', () => deleteItem(item.id));

        list.appendChild(li);
      });
    }

    function openEditor(li, item) {
      // Hide view controls
      li.querySelector('.item-text').style.display = 'none';
      li.querySelector('.edit-btn').style.display = 'none';
      li.querySelector('.delete-btn').style.display = 'none';

      // Remove any existing edit area
      const existing = li.querySelector('.edit-area');
      if (existing) existing.remove();

      const editArea = document.createElement('div');
      editArea.className = 'edit-area';
      editArea.innerHTML = `
        <input class="edit-input" aria-label="Edit title" type="text" value="${escapeHtml(item.title)}" />
        <button class="save-btn" type="button">Save</button>
        <button class="cancel-btn" type="button">Cancel</button>
        <div class="error-msg" role="alert" style="display:none;"></div>
      `;

      const input = editArea.querySelector('.edit-input');
      const saveBtn = editArea.querySelector('.save-btn');
      const cancelBtn = editArea.querySelector('.cancel-btn');
      const errorDiv = editArea.querySelector('.error-msg');

      saveBtn.addEventListener('click', async () => {
        const newTitle = input.value.trim();
        if (!newTitle) {
          errorDiv.textContent = 'Title cannot be empty.';
          errorDiv.style.display = '';
          return;
        }
        errorDiv.style.display = 'none';

        try {
          const res = await fetch(`/api/todos/${item.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: input.value })
          });
          if (!res.ok) {
            const body = await res.json().catch(() => ({}));
            errorDiv.textContent = body.error || `Save failed (HTTP ${res.status}).`;
            errorDiv.style.display = '';
            return;
          }
          await fetchTodos();
        } catch (err) {
          errorDiv.textContent = 'Network error. Please try again.';
          errorDiv.style.display = '';
        }
      });

      cancelBtn.addEventListener('click', () => closeEditor(li));

      li.appendChild(editArea);
      input.focus();
    }

    function closeEditor(li) {
      const editArea = li.querySelector('.edit-area');
      if (editArea) editArea.remove();
      const span = li.querySelector('.item-text');
      if (span) span.style.display = '';
      const editBtn = li.querySelector('.edit-btn');
      if (editBtn) editBtn.style.display = '';
      const deleteBtn = li.querySelector('.delete-btn');
      if (deleteBtn) deleteBtn.style.display = '';
    }

    document.getElementById('todo-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });
      input.value = '';
      fetchTodos();
    };

    async function toggleStatus(id, completed) {
      await fetch(`/api/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      fetchTodos();
    }

    async function deleteItem(id) {
      await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      fetchTodos();
    }

    fetchTodos();
  </script>
</body>
</html>
