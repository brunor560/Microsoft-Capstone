<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo Benchmark Baseline</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 550px; margin: 50px auto; padding: 0 20px; color: #222; }
    h1 { color: #006747; border-bottom: 2px solid #006747; padding-bottom: 8px; }
    form { display: flex; flex-direction: column; gap: 8px; margin: 20px 0; }
    input, textarea { padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    textarea { min-height: 72px; resize: vertical; }
    button { padding: 10px 18px; background: #006747; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 12px 8px; border-bottom: 1px solid #eee; }
    .item-text { cursor: pointer; flex: 1; }
    .todo-content { flex: 1; }
    .notes { white-space: pre-wrap; overflow-wrap: anywhere; margin-top: 4px; }
    .notes a { color: #006747; }
    .done { text-decoration: line-through; color: #888; }
    .delete-btn { background: #d9534f; padding: 6px 10px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Baseline Test Application</h1>
  <form id="todo-form">
    <input id="todo-input" placeholder="Enter task requirement..." required />
    <textarea id="notes-input" aria-label="Notes" placeholder="Notes"></textarea>
    <button type="submit">Add Task</button>
  </form>
  <ul id="todo-list"></ul>

  <script>
    const list = document.getElementById('todo-list');
    async function fetchTodos() {
      const res = await fetch('/api/todos');
      const data = await res.json();
      list.replaceChildren(...data.map(item => {
        const row = document.createElement('li');
        const content = document.createElement('div');
        content.className = 'todo-content';
        const title = document.createElement('span');
        title.className = `item-text ${item.completed ? 'done' : ''}`;
        title.textContent = item.title;
        title.onclick = () => toggleStatus(item.id, !item.completed);
        content.append(title);
        if (item.notes) {
          const notes = document.createElement('div');
          notes.className = 'notes';
          formatNotes(notes, item.notes);
          content.append(notes);
        }
        const button = document.createElement('button');
        button.className = 'delete-btn';
        button.textContent = 'Delete';
        button.onclick = () => deleteItem(item.id);
        row.append(content, button);
        return row;
      }));
    }
    function formatNotes(container, value) {
      const pattern = /\*\*([^*]+)\*\*|\[(.*?)\]\((https?:\/\/[^\s)]+)\)/g;
      let lastIndex = 0;
      for (const match of value.matchAll(pattern)) {
        container.append(document.createTextNode(value.slice(lastIndex, match.index)));
        if (match[1] !== undefined) {
          const strong = document.createElement('strong');
          strong.textContent = match[1];
          container.append(strong);
        } else {
          const link = document.createElement('a');
          link.textContent = match[2];
          link.href = match[3];
          container.append(link);
        }
        lastIndex = match.index + match[0].length;
      }
      container.append(document.createTextNode(value.slice(lastIndex)));
    }
    document.getElementById('todo-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      const notes = document.getElementById('notes-input');
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value, notes: notes.value })
      });
      input.value = '';
      notes.value = '';
      fetchTodos();
    };
    async function toggleStatus(id, completed) {
      await fetch(`/api/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      fetchTodos();
    }
    async function deleteItem(id) {
      await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      fetchTodos();
    }
    fetchTodos();
  </script>
</body>
</html>
