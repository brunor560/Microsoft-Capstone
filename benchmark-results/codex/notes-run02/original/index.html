<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo Benchmark Baseline</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 550px; margin: 50px auto; padding: 0 20px; color: #222; }
    h1 { color: #006747; border-bottom: 2px solid #006747; padding-bottom: 8px; }
    form { display: flex; flex-wrap: wrap; gap: 8px; margin: 20px 0; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    textarea { width: 100%; min-height: 70px; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font: inherit; }
    button { padding: 10px 18px; background: #006747; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: flex-start; padding: 12px 8px; border-bottom: 1px solid #eee; gap: 12px; }
    .item-text { cursor: pointer; flex: 1; }
    .notes { white-space: pre-wrap; margin-top: 4px; overflow-wrap: anywhere; }
    .done { text-decoration: line-through; color: #888; }
    .delete-btn { background: #d9534f; padding: 6px 10px; font-size: 0.85rem; }
  </style>
</head>
<body>
  <h1>Baseline Test Application</h1>
  <form id="todo-form">
    <input id="todo-input" placeholder="Enter task requirement..." required />
    <textarea id="todo-notes" aria-label="Notes"></textarea>
    <button type="submit">Add Task</button>
  </form>
  <ul id="todo-list"></ul>

  <script>
    const list = document.getElementById('todo-list');
    function appendFormattedNotes(container, notes) {
      const pattern = /\*\*(.+?)\*\*|\[(.+?)\]\((https?:\/\/[^\s)]+)\)/g;
      let lastIndex = 0;
      let match;
      while ((match = pattern.exec(notes)) !== null) {
        container.appendChild(document.createTextNode(notes.slice(lastIndex, match.index)));
        if (match[1] !== undefined) {
          const strong = document.createElement('strong');
          strong.textContent = match[1];
          container.appendChild(strong);
        } else {
          const link = document.createElement('a');
          link.textContent = match[2];
          link.href = match[3];
          container.appendChild(link);
        }
        lastIndex = pattern.lastIndex;
      }
      container.appendChild(document.createTextNode(notes.slice(lastIndex)));
    }
    async function fetchTodos() {
      const res = await fetch('/api/todos');
      const data = await res.json();
      list.replaceChildren();
      data.forEach(item => {
        const row = document.createElement('li');
        const content = document.createElement('div');
        const title = document.createElement('span');
        title.className = `item-text ${item.completed ? 'done' : ''}`;
        title.textContent = item.title;
        title.addEventListener('click', () => toggleStatus(item.id, !item.completed));
        content.appendChild(title);
        if (item.notes) {
          const notes = document.createElement('div');
          notes.className = 'notes';
          appendFormattedNotes(notes, item.notes);
          content.appendChild(notes);
        }
        const button = document.createElement('button');
        button.className = 'delete-btn';
        button.textContent = 'Delete';
        button.addEventListener('click', () => deleteItem(item.id));
        row.append(content, button);
        list.appendChild(row);
      });
    }
    document.getElementById('todo-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      const notes = document.getElementById('todo-notes');
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value, notes: notes.value })
      });
      input.value = '';
      notes.value = '';
      fetchTodos();
    };
    async function toggleStatus(id, completed) {
      await fetch(`/api/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      fetchTodos();
    }
    async function deleteItem(id) {
      await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      fetchTodos();
    }
    fetchTodos();
  </script>
</body>
</html>
