<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo Benchmark Baseline</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 550px; margin: 50px auto; padding: 0 20px; color: #222; }
    h1 { color: #006747; border-bottom: 2px solid #006747; padding-bottom: 8px; }
    form { display: flex; gap: 8px; margin: 20px 0; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    button { padding: 10px 18px; background: #006747; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; gap: 8px; padding: 12px 8px; border-bottom: 1px solid #eee; }
    .item-text { cursor: pointer; flex: 1; }
    .done { text-decoration: line-through; color: #888; }
    .delete-btn { background: #d9534f; padding: 6px 10px; font-size: 0.85rem; }
    [role="alert"] { color: #b42318; width: 100%; }
  </style>
</head>
<body>
  <h1>Baseline Test Application</h1>
  <form id="todo-form">
    <input id="todo-input" placeholder="Enter task requirement..." required />
    <button type="submit">Add Task</button>
  </form>
  <ul id="todo-list"></ul>

  <script>
    const list = document.getElementById('todo-list');

    async function fetchTodos() {
      const res = await fetch('/api/todos');
      const data = await res.json();
      list.replaceChildren(...data.map(createTodoRow));
    }

    function createTodoRow(item) {
      const row = document.createElement('li');
      row.dataset.todoId = item.id;
      const title = document.createElement('span');
      title.className = `item-text ${item.completed ? 'done' : ''}`;
      title.textContent = item.title;
      title.addEventListener('click', () => {
        if (!row.querySelector('input[aria-label="Edit title"]')) toggleStatus(item.id, !item.completed);
      });
      const edit = document.createElement('button');
      edit.type = 'button';
      edit.textContent = 'Edit';
      edit.addEventListener('click', () => openEditor(row, item));
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'delete-btn';
      remove.textContent = 'Delete';
      remove.addEventListener('click', () => deleteItem(item.id));
      row.append(title, edit, remove);
      return row;
    }

    function showError(row, message) {
      let alert = row.querySelector('[role="alert"]');
      if (!alert) {
        alert = document.createElement('div');
        alert.setAttribute('role', 'alert');
        row.append(alert);
      }
      alert.textContent = message;
    }

    function openEditor(row, item) {
      if (row.querySelector('input[aria-label="Edit title"]')) return;
      const input = document.createElement('input');
      input.setAttribute('aria-label', 'Edit title');
      input.value = item.title;
      const save = document.createElement('button');
      save.type = 'button';
      save.textContent = 'Save';
      const cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.textContent = 'Cancel';
      const title = row.querySelector('.item-text');
      const edit = Array.from(row.querySelectorAll('button')).find(button => button.textContent === 'Edit');
      title.hidden = true;
      edit.hidden = true;
      row.insertBefore(input, title);
      row.insertBefore(save, edit);
      row.insertBefore(cancel, edit);
      const close = () => {
        input.remove(); save.remove(); cancel.remove();
        title.hidden = false; edit.hidden = false;
        const alert = row.querySelector('[role="alert"]');
        if (alert) alert.remove();
      };
      cancel.addEventListener('click', close);
      save.addEventListener('click', async () => {
        const value = input.value.trim();
        if (!value) { showError(row, 'Title cannot be empty.'); return; }
        try {
          const response = await fetch(`/api/todos/${item.id}`, {
            method: 'PUT', headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title: value })
          });
          if (!response.ok) { showError(row, 'Could not save the title. Please try again.'); return; }
          const updated = await response.json();
          item.title = updated.title;
          title.textContent = updated.title;
          close();
        } catch (_) {
          showError(row, 'Could not save the title. Please check your connection.');
        }
      });
      input.focus();
    }

    document.getElementById('todo-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      await fetch('/api/todos', {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });
      input.value = '';
      fetchTodos();
    };

    async function toggleStatus(id, completed) {
      await fetch(`/api/todos/${id}`, {
        method: 'PUT', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      fetchTodos();
    }

    async function deleteItem(id) {
      await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      fetchTodos();
    }

    fetchTodos();
  </script>
</body>
</html>
