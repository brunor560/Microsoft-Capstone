<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Todo Benchmark Baseline</title>
  <style>
    body { font-family: system-ui, -apple-system, sans-serif; max-width: 550px; margin: 50px auto; padding: 0 20px; color: #222; }
    h1 { color: #006747; border-bottom: 2px solid #006747; padding-bottom: 8px; }
    form { display: flex; gap: 8px; margin: 20px 0; }
    input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; font-size: 1rem; }
    button { padding: 10px 18px; background: #006747; color: white; border: none; border-radius: 4px; cursor: pointer; font-weight: 600; }
    ul { list-style: none; padding: 0; }
    li { display: flex; justify-content: space-between; align-items: center; padding: 12px 8px; border-bottom: 1px solid #eee; }
    .item-text { cursor: pointer; flex: 1; }
    .done { text-decoration: line-through; color: #888; }
    .delete-btn { background: #d9534f; padding: 6px 10px; font-size: 0.85rem; }
    .editor { flex: 1; flex-wrap: wrap; margin: 0; }
    [role="alert"] { width: 100%; color: #b42318; }
  </style>
</head>
<body>
  <h1>Baseline Test Application</h1>
  <form id="todo-form">
    <input id="todo-input" placeholder="Enter task requirement..." required />
    <button type="submit">Add Task</button>
  </form>
  <ul id="todo-list"></ul>

  <script>
    const list = document.getElementById('todo-list');
    async function fetchTodos() {
      const res = await fetch('/api/todos');
      const data = await res.json();
      list.replaceChildren(...data.map(createRow));
    }
    function createRow(item) {
      const row = document.createElement('li');
      row.dataset.todoId = item.id;
      const title = document.createElement('span');
      title.className = `item-text ${item.completed ? 'done' : ''}`;
      title.textContent = item.title;
      title.onclick = () => toggleStatus(item.id, !item.completed);
      const edit = document.createElement('button');
      edit.type = 'button';
      edit.textContent = 'Edit';
      edit.onclick = () => openEditor(row, item);
      const remove = document.createElement('button');
      remove.type = 'button';
      remove.className = 'delete-btn';
      remove.textContent = 'Delete';
      remove.onclick = () => deleteItem(item.id);
      row.append(title, edit, remove);
      return row;
    }
    function openEditor(row, item) {
      const form = document.createElement('form');
      form.className = 'editor';
      const input = document.createElement('input');
      input.setAttribute('aria-label', 'Edit title');
      input.value = item.title;
      const save = document.createElement('button');
      save.type = 'submit';
      save.textContent = 'Save';
      const cancel = document.createElement('button');
      cancel.type = 'button';
      cancel.textContent = 'Cancel';
      cancel.onclick = () => {
        const replacement = createRow(item);
        row.replaceWith(replacement);
        replacement.querySelector('button').focus();
      };
      const error = document.createElement('div');
      error.setAttribute('role', 'alert');
      form.append(input, save, cancel, error);
      form.onsubmit = async (event) => {
        event.preventDefault();
        const title = input.value.trim();
        if (!title) {
          error.textContent = 'Enter a nonempty title.';
          input.focus();
          return;
        }
        error.textContent = '';
        save.disabled = true;
        cancel.disabled = true;
        input.disabled = true;
        try {
          const response = await fetch(`/api/todos/${item.id}`, {
            method: 'PUT',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ title })
          });
          if (!response.ok) throw new Error('Save failed');
          const saved = await response.json();
          const replacement = createRow(saved);
          row.replaceWith(replacement);
          replacement.querySelector('button').focus();
        } catch {
          error.textContent = 'Unable to save the title. Please try again.';
        } finally {
          save.disabled = false;
          cancel.disabled = false;
          input.disabled = false;
        }
      };
      row.replaceChildren(form);
      input.focus();
    }
    document.getElementById('todo-form').onsubmit = async (e) => {
      e.preventDefault();
      const input = document.getElementById('todo-input');
      await fetch('/api/todos', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ title: input.value })
      });
      input.value = '';
      fetchTodos();
    };
    async function toggleStatus(id, completed) {
      await fetch(`/api/todos/${id}`, {
        method: 'PUT',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ completed })
      });
      fetchTodos();
    }
    async function deleteItem(id) {
      await fetch(`/api/todos/${id}`, { method: 'DELETE' });
      fetchTodos();
    }
    fetchTodos();
  </script>
</body>
</html>
