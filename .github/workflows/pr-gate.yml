name: PR gate

# Required check for task 008 pull requests. It enforces CONTRIBUTING.md:
# branch naming, pull request title and description, and npm test.

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
    branches: ['bench008/**']

permissions:
  contents: read

concurrency:
  group: pr-gate-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: pr-gate
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out the pull request
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Pull request rules (CONTRIBUTING.md)
        env:
          PR_TITLE: ${{ github.event.pull_request.title }}
          PR_BODY: ${{ github.event.pull_request.body }}
          HEAD_REF: ${{ github.head_ref }}
          BASE_REF: ${{ github.base_ref }}
        run: node .github/scripts/pr-rules.cjs

      - name: Install
        working-directory: app
        run: npm ci --ignore-scripts

      - name: npm test
        working-directory: app
        run: npm test
