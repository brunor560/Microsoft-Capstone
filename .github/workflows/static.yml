# Simple workflow for deploying static content to GitHub Pages
name: Deploy static content to Pages

on:
  # Runs on pushes targeting the default branch
  push:
    branches: ["master"]

  # Results live on a separate branch. Refresh even when master has not changed.
  # Scheduled workflows run from the default branch; GitHub may delay them.
  schedule:
    - cron: '7,22,37,52 * * * *'

  # Allows you to run this workflow manually from the Actions tab
  workflow_dispatch:

# Sets permissions of the GITHUB_TOKEN to allow deployment to GitHub Pages
permissions:
  contents: read
  pages: write
  id-token: write

# Allow only one concurrent deployment, skipping runs queued between the run in-progress and latest queued.
# However, do NOT cancel in-progress runs as we want to allow these production deployments to complete.
concurrency:
  group: "pages"
  cancel-in-progress: false

jobs:
  # Single deploy job since we're just deploying
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          ref: master
          # The builder reads results and frozen task baselines directly from git.
          fetch-depth: 0
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Fetch current results
        run: git fetch origin +refs/heads/results/all-runs:refs/remotes/origin/results/all-runs
      - name: Build current dashboard data
        run: node dashboard/build-data.mjs origin/results/all-runs
      - name: Verify dashboard snapshot
        shell: bash
        run: |
          node --input-type=module <<'JS'
          import { readFileSync } from 'node:fs';
          import { execFileSync } from 'node:child_process';
          import vm from 'node:vm';
          const context = { window: {} };
          vm.runInNewContext(readFileSync('dashboard/data.js', 'utf8'), context);
          const data = context.window.BENCH_DATA;
          const expected = execFileSync('git', ['rev-parse', '--short', 'origin/results/all-runs'], { encoding: 'utf8' }).trim();
          if (data?.branchCommit !== expected || !data?.runs?.length) {
            throw new Error('Dashboard snapshot is stale or empty; refusing to publish.');
          }
          console.log(`Verified ${data.runs.length} runs from ${expected}`);
          JS
      - name: Setup Pages
        uses: actions/configure-pages@v5
      - name: Upload artifact
        uses: actions/upload-pages-artifact@v3
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: './dashboard'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
