name: Feature matrix checks

# Offline checks for the Approach A feature matrix and its public page.
#
# COST: zero. No Azure credentials, no model calls, no network access by the tests.
# This is a pull-request check. It does not deploy anything; the Pages deploy stays in static.yml.
# To make it a merge gate, mark "Feature matrix checks" as a required status check in branch protection.

on:
  pull_request:
    branches: [master]
    paths:
      - 'dashboard/feature-matrix/**'
      - 'assessment/**'
      - 'tools/approach_a/**'
      - '.github/workflows/feature-matrix-checks.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  checks:
    name: Exporter, data file and page tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Check out
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'

      - name: Set up Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Python tests (exporter, public data file, workbench)
        run: python3 -m unittest discover -s tools/approach_a/tests -t .

      - name: Page tests (logic and rendering safety)
        run: node --test tools/approach_a/tests/js/*.test.mjs

      - name: Public data file is the empty marker or an accepted export
        run: python3 -m unittest tools.approach_a.tests.test_publish_files.CommittedDataFile -v

      - name: Page modules parse
        run: for f in dashboard/feature-matrix/*.mjs; do node --check "$f"; done
