name: App UI Tests

# Browser tests for the baseline client (SRS Spec 3.2): the task list stays in
# step with the backend without page reloads, and updates within 100 ms of
# the server response, in Chrome, Edge and Firefox.
#
# The tests live in app-ui-tests/ and only read app/, so the shared testbed
# is not modified.

on:
  push:
    paths:
      - 'app/**'
      - 'app-ui-tests/**'
      - '.github/workflows/app-ui-tests.yml'
  pull_request:
    paths:
      - 'app/**'
      - 'app-ui-tests/**'
      - '.github/workflows/app-ui-tests.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  browsers:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'

      - name: Install the baseline app
        working-directory: app
        run: npm install --no-audit --no-fund

      - name: Install the test runner and browsers
        working-directory: app-ui-tests
        run: |
          npm install --no-audit --no-fund
          npx playwright install --with-deps chrome msedge firefox

      - name: Run the client tests in Chrome, Edge and Firefox
        working-directory: app-ui-tests
        run: npx playwright test
