name: Agent PR Referee

# Independently re-grades agent-authored pull requests (project brief, s7).
#
# The host computes F, S and Q locally, but a self-reported score is not
# evidence. This workflow re-runs the same graders in the same pinned
# container so the numbers can be verified by someone who does not trust
# the machine that produced them.
#
# COST: zero. No model is invoked -- graders analyse code only.

on:
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      pr_number:
        description: 'PR number to re-grade'
        required: false

permissions:
  contents: read
  pull-requests: write

jobs:
  referee:
    # Only agent-generated branches need refereeing; human PRs are reviewed
    # normally. `agent/` is the namespace pr_export.py writes to.
    if: startsWith(github.head_ref, 'agent/') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@v4
        with:
          # Full history so the security grader can walk commits: a secret
          # that was committed and then deleted must still be detected.
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: pipeline/autogen/requirements.txt

      - name: Install host dependencies
        working-directory: pipeline/autogen
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build the grading container
        working-directory: pipeline/autogen
        run: docker build -t agentic-eval-sandbox:latest .devcontainer

      # The workspace is the directory the agent actually modified. It is
      # NOT hardcoded to app/: that is a Node project, and the referee
      # deliberately refuses to grade a target whose test framework it
      # cannot run rather than reporting a misleading F=0.
      - name: Determine the graded workspace
        id: target
        run: |
          if [ -n "${{ vars.REFEREE_WORKSPACE }}" ]; then
            echo "path=$GITHUB_WORKSPACE/${{ vars.REFEREE_WORKSPACE }}" >> "$GITHUB_OUTPUT"
          else
            echo "path=$GITHUB_WORKSPACE/pipeline/autogen" >> "$GITHUB_OUTPUT"
          fi

      - name: Re-grade the pull request
        working-directory: pipeline/autogen
        # Exit 1 when a grader fails or the framework is unsupported, so an
        # unverifiable PR never shows a green check.
        run: |
          python -m harness.referee \
            --workspace "${{ steps.target.outputs.path }}" \
            --output referee.json

      - name: Publish the referee verdict
        # Runs even when grading failed, so the reason is visible on the PR.
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const path = 'pipeline/autogen/referee.json';
            if (!fs.existsSync(path)) {
              core.setFailed('Referee produced no report.');
              return;
            }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));

            let body;
            if (report.final_score === null) {
              // Not graded at all -- say so plainly rather than publishing a
              // zero that looks like a real result.
              body = [
                '## 🧑‍⚖️ Referee verdict: NOT GRADED',
                '',
                'This PR could not be scored:',
                '',
                ...(report.grader_errors || []).map(e => `- ${e}`),
                '',
                'No score is published, because an ungraded run must not be',
                'mistaken for a poor one.',
              ].join('\n');
            } else {
              const rows = Object.entries(report.dimensions || {})
                .map(([k, v]) => `| ${k} | ${v} |`).join('\n');
              body = [
                '## 🧑‍⚖️ Referee verdict (CI-verified)',
                '',
                'Recomputed independently of the host that opened this PR,',
                'using the same pinned grading container.',
                '',
                '| Dimension | Score |',
                '|---|---|',
                rows,
                '',
                `**Final score (F, S, Q only): ${report.final_score}**`,
                '',
                `_${report.scope}_`,
                '',
                report.reliable
                  ? '✅ All graders ran successfully.'
                  : '⚠️ **Provisional:** a grader failed, so a dimension may read 0 without the agent actually scoring 0.',
              ].join('\n');
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });

      - name: Upload the referee report
        uses: actions/upload-artifact@v4
        with:
          name: referee-report
          path: pipeline/autogen/referee.json
