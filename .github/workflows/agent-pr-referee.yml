name: Agent PR Referee

# Independently re-grades agent-authored pull requests (project brief, s7;
# SRS Spec 4.5).
#
# The host computes F, S and Q locally, but a self-reported score is not
# evidence. This workflow re-runs the same graders in the same pinned
# container so the numbers can be verified by someone who does not trust
# the machine that produced them.
#
# Trust boundary (SRS clauses 4.5.1 and 4.5.4):
#
#   * The grading logic and the container definition come from the base
#     branch, checked out into `trusted/`. The pull request is checked out
#     into `candidate/` and is only ever read as data, so a pull request
#     cannot change how it is graded.
#   * `grade` holds a read-only token. `publish` holds the only write
#     permission and never checks out or runs anything from the pull request.
#
# Every third-party action is pinned by commit SHA (clause 4.5.6).
#
# COST: zero. No model is invoked -- graders analyse code only.

on:
  pull_request:
    # The repository's default branch (clause 4.5.5).
    branches: [master]

# No job inherits a permission it did not ask for.
permissions: {}

jobs:
  grade:
    # Only agent-generated branches need refereeing; human PRs are reviewed
    # normally. `agent/` is the namespace pr_export.py writes to.
    if: startsWith(github.head_ref, 'agent/')
    runs-on: ubuntu-latest
    timeout-minutes: 25
    permissions:
      contents: read

    steps:
      - name: Check out the base branch (trusted grading logic)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          path: trusted
          persist-credentials: false

      - name: Check out the pull request (candidate, read as data)
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          ref: ${{ github.event.pull_request.head.sha }}
          path: candidate
          # Full history so the security grader can walk commits: a secret
          # that was committed and then deleted must still be detected.
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: trusted/pipeline/autogen/requirements.txt

      - name: Install host dependencies
        working-directory: trusted/pipeline/autogen
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      - name: Build the grading container
        working-directory: trusted/pipeline/autogen
        run: docker build -t agentic-eval-sandbox:latest .devcontainer

      # The workspace is the directory the agent actually modified. It is
      # NOT hardcoded to app/: that is a Node project, and the referee
      # deliberately refuses to grade a target whose test framework it
      # cannot run rather than reporting a misleading F=0.
      - name: Determine the graded workspace
        id: target
        env:
          REFEREE_WORKSPACE: ${{ vars.REFEREE_WORKSPACE }}
        run: |
          echo "path=$GITHUB_WORKSPACE/candidate/${REFEREE_WORKSPACE:-pipeline/autogen}" >> "$GITHUB_OUTPUT"

      - name: Re-grade the pull request
        working-directory: trusted/pipeline/autogen
        # Grading must finish within 120 seconds (clause 4.5.3).
        timeout-minutes: 2
        # Exit 1 unless every acceptance test passes and every grader ran, so
        # a failing or unverifiable PR never shows a green check (4.5.2).
        run: |
          python -m harness.referee \
            --workspace "${{ steps.target.outputs.path }}" \
            --output "$GITHUB_WORKSPACE/referee.json"

      - name: Upload the referee report
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: referee-report
          path: referee.json
          if-no-files-found: ignore

  publish:
    # Runs even when grading failed, so the reason is visible on the PR.
    needs: grade
    if: always() && needs.grade.result != 'skipped'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      pull-requests: write

    steps:
      - name: Download the referee report
        continue-on-error: true
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: referee-report

      - name: Publish the referee verdict
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            const fs = require('fs');
            const path = 'referee.json';
            if (!fs.existsSync(path)) {
              core.setFailed('Referee produced no report.');
              return;
            }
            const report = JSON.parse(fs.readFileSync(path, 'utf8'));

            let body;
            if (report.final_score === null) {
              // Not graded at all -- say so plainly rather than publishing a
              // zero that looks like a real result.
              body = [
                '## 🧑‍⚖️ Referee verdict: NOT GRADED',
                '',
                'This PR could not be scored:',
                '',
                ...(report.grader_errors || []).map(e => `- ${e}`),
                '',
                'No score is published, because an ungraded run must not be',
                'mistaken for a poor one.',
              ].join('\n');
            } else {
              const rows = Object.entries(report.dimensions || {})
                .map(([k, v]) => `| ${k} | ${v} |`).join('\n');
              body = [
                '## 🧑‍⚖️ Referee verdict (CI-verified)',
                '',
                'Recomputed independently of the host that opened this PR,',
                'using grading logic from the base branch and the same pinned',
                'grading container.',
                '',
                '| Dimension | Score |',
                '|---|---|',
                rows,
                '',
                `**Final score (F, S, Q only): ${report.final_score}**`,
                '',
                `_${report.scope}_`,
                '',
                report.reliable
                  ? '✅ All graders ran successfully.'
                  : '⚠️ **Provisional:** a grader failed, so a dimension may read 0 without the agent actually scoring 0.',
              ].join('\n');
            }

            await github.rest.issues.createComment({
              issue_number: context.issue.number,
              owner: context.repo.owner,
              repo: context.repo.repo,
              body,
            });
