name: Publish Sandbox Image

# Publishes the grading container to ghcr.io so the whole team PULLS one
# identical image instead of each member rebuilding it locally.
#
# This is the real fix for grader-version drift. Pinning tool versions in the
# Dockerfile only guarantees consistency if everyone's image was actually
# built from the current file; a stale local cache would grade with a
# different analyser and say nothing. A shared digest removes that class of
# problem entirely.
#
# COST: zero (GitHub-hosted runners, public package storage).

on:
  push:
    branches: [main]
    paths:
      - 'pipeline/autogen/.devcontainer/**'
      - '.github/workflows/publish-sandbox-image.yml'
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}/agentic-eval-sandbox

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=sha,format=long

      - name: Build and push
        id: build
        uses: docker/build-push-action@v6
        with:
          context: pipeline/autogen/.devcontainer
          # Both architectures: developers are on Apple Silicon (arm64) and
          # CI runners are x86 (amd64). One definition, no emulation either
          # way. Verified in Phase 1 -- trufflehog and scc both ship native
          # linux_arm64 and linux_amd64 builds.
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Verify the published image
        run: |
          IMAGE="${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest"
          docker pull "$IMAGE"
          echo "--- grader toolchain ---"
          docker run --rm "$IMAGE" pytest --version
          docker run --rm "$IMAGE" trufflehog --version
          docker run --rm "$IMAGE" scc --version
          docker run --rm "$IMAGE" python -c \
            "import importlib.metadata as m; print('complexipy', m.version('complexipy'))"

      - name: Report the digest
        run: |
          echo "### Sandbox image published" >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Pull the shared image instead of rebuilding locally:' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo '```bash' >> "$GITHUB_STEP_SUMMARY"
          echo "docker pull ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest" >> "$GITHUB_STEP_SUMMARY"
          echo "docker tag ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}:latest agentic-eval-sandbox:latest" >> "$GITHUB_STEP_SUMMARY"
          echo '```' >> "$GITHUB_STEP_SUMMARY"
          echo '' >> "$GITHUB_STEP_SUMMARY"
          echo 'Digest: `${{ steps.build.outputs.digest }}`' >> "$GITHUB_STEP_SUMMARY"
